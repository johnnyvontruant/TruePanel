<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="720"
  viewBox="0 0 1200 720"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">TruePanel architecture</title>
  <desc id="description">
    Hardware and TrueNAS telemetry flow through collectors and a safety
    policy layer to the LCD Flight Deck and Mission Control web dashboard.
  </desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c28"/>
      <stop offset="1" stop-color="#0a111a"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>

    <marker
      id="arrow"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto"
    >
      <path d="M0,0 L12,6 L0,12 Z" fill="#5cd6c0"/>
    </marker>

    <style>
      .background {
        fill: #071019;
      }

      .grid-line {
        stroke: #173042;
        stroke-width: 1;
        opacity: 0.35;
      }

      .box {
        fill: url(#panel);
        stroke: #2a5369;
        stroke-width: 2;
        rx: 18;
        filter: url(#shadow);
      }

      .accent-box {
        fill: #102a30;
        stroke: #5cd6c0;
        stroke-width: 2;
        rx: 18;
        filter: url(#shadow);
      }

      .title {
        fill: #eef8ff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 28px;
        font-weight: 700;
        text-anchor: middle;
      }

      .label {
        fill: #eef8ff;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 21px;
        font-weight: 700;
        text-anchor: middle;
      }

      .detail {
        fill: #9db5c4;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 15px;
        text-anchor: middle;
      }

      .edge {
        fill: none;
        stroke: #5cd6c0;
        stroke-width: 4;
        marker-end: url(#arrow);
      }

      .safe {
        fill: #5cd6c0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 14px;
        font-weight: 700;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="720"/>

  <g>
    <path class="grid-line" d="M0 90 H1200"/>
    <path class="grid-line" d="M0 180 H1200"/>
    <path class="grid-line" d="M0 270 H1200"/>
    <path class="grid-line" d="M0 360 H1200"/>
    <path class="grid-line" d="M0 450 H1200"/>
    <path class="grid-line" d="M0 540 H1200"/>
    <path class="grid-line" d="M0 630 H1200"/>

    <path class="grid-line" d="M150 0 V720"/>
    <path class="grid-line" d="M300 0 V720"/>
    <path class="grid-line" d="M450 0 V720"/>
    <path class="grid-line" d="M600 0 V720"/>
    <path class="grid-line" d="M750 0 V720"/>
    <path class="grid-line" d="M900 0 V720"/>
    <path class="grid-line" d="M1050 0 V720"/>
  </g>

  <text class="title" x="600" y="54">
    TruePanel Operational Architecture
  </text>

  <rect class="box" x="80" y="105" width="280" height="125"/>
  <text class="label" x="220" y="145">Hardware &amp; TrueNAS</text>
  <text class="detail" x="220" y="178">
    LCD · Fans · Drives · Pools
  </text>
  <text class="detail" x="220" y="202">
    Network · SMART · ZFS · LEDs
  </text>

  <rect class="box" x="460" y="105" width="280" height="125"/>
  <text class="label" x="600" y="145">Collectors</text>
  <text class="detail" x="600" y="178">
    Normalize system and hardware state
  </text>
  <text class="detail" x="600" y="202">
    No dashboard-specific hardware reads
  </text>

  <rect class="box" x="840" y="105" width="280" height="125"/>
  <text class="label" x="980" y="145">Historical Telemetry</text>
  <text class="detail" x="980" y="178">
    Trends · Events · Recommendations
  </text>
  <text class="detail" x="980" y="202">
    Diagnostics and operator context
  </text>

  <rect
    class="accent-box"
    x="410"
    y="315"
    width="380"
    height="145"
  />
  <text class="label" x="600" y="357">
    Mission Control &amp; Safety Policy
  </text>
  <text class="detail" x="600" y="390">
    Watchers · Alerts · Thermal recommendations
  </text>
  <text class="detail" x="600" y="414">
    Fan interlocks · Readiness gates · Recovery
  </text>
  <text class="safe" x="600" y="442">
    AUTOMATIC THERMAL CONTROL REMAINS UNARMED
  </text>

  <rect class="box" x="120" y="555" width="360" height="115"/>
  <text class="label" x="300" y="597">LCD Flight Deck</text>
  <text class="detail" x="300" y="628">
    16×2 display · Buttons · Alerts · Graphics
  </text>

  <rect class="box" x="720" y="555" width="360" height="115"/>
  <text class="label" x="900" y="597">Mission Control Web UI</text>
  <text class="detail" x="900" y="628">
    Live status · History · Guarded controls
  </text>

  <path class="edge" d="M360 168 H455"/>
  <path class="edge" d="M740 168 H835"/>
  <path class="edge" d="M600 230 V308"/>
  <path class="edge" d="M980 230 C980 285 840 300 790 350"/>
  <path class="edge" d="M530 460 C500 500 390 520 330 550"/>
  <path class="edge" d="M670 460 C700 500 810 520 870 550"/>
</svg>
