name: Update Host runtime bootstrap contracts

on:
  push:
    branches:
      - agent/host-runtime-from-bootstrap

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[host-runtime-bootstrap-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-runtime-from-bootstrap
          fetch-depth: 0

      - name: Update stale bootstrap factory ownership contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')

          old = '''def test_lcd_delegates_host_safety_service_assembly():\n    runtime = source()\n\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    assert "HostAgentSafetyServices" not in runtime\n    assert "host_bootstrap.safety_services(" in runtime\n    assert "HostAgentSafetyServices" in bootstrap\n    assert "def safety_services(" in bootstrap\n    assert "fan_telemetry_provider=(" in bootstrap\n    assert "fan_status_publisher=(" in bootstrap\n    assert "fan_event_recorder=(" in bootstrap\n    assert "set_thermal_operator_arm_state" not in runtime\n    assert "thermal_control_handler_factory=(" in bootstrap\n'''
          new = '''def test_lcd_delegates_host_safety_service_assembly():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    factory = Path(\n        "truepanel/host/factory.py"\n    ).read_text(encoding="utf-8")\n\n    assert "HostAgentSafetyServices" not in runtime\n    assert "host_bootstrap.safety_services(" not in runtime\n    assert "bootstrap.safety_services()" in factory\n    assert "HostAgentSafetyServices" in bootstrap\n    assert "def safety_services(" in bootstrap\n    assert "fan_telemetry_provider=(" in bootstrap\n    assert "fan_status_publisher=(" in bootstrap\n    assert "fan_event_recorder=(" in bootstrap\n    assert "set_thermal_operator_arm_state" not in runtime\n    assert "thermal_control_handler_factory=(" in bootstrap\n'''
          if old not in text:
              raise SystemExit('Host safety service ownership contract not found')
          text = text.replace(old, new, 1)

          old = '''    assert "set_thermal_operator_arm_state" not in runtime\n    assert "host_bootstrap.safety_services()" in runtime\n    assert "build_thermal_control_handler" in bootstrap\n'''
          new = '''    assert "set_thermal_operator_arm_state" not in runtime\n    assert "host_bootstrap.safety_services()" not in runtime\n    assert "bootstrap.safety_services()" in factory\n    assert "build_thermal_control_handler" in bootstrap\n'''
          if old not in text:
              raise SystemExit('thermal action bootstrap ownership contract not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_factory_wiring.py')
          text = path.read_text(encoding='utf-8')

          old = '''    end = text.index(\n        "host_agent_runtime = "\n        "build_host_agent_runtime(",\n        start,\n    )\n'''
          new = '''    end = text.index(\n        "host_agent_runtime = (",\n        start,\n    )\n'''
          if old not in text:
              raise SystemExit('application hook factory boundary anchor not found')
          text = text.replace(old, new, 1)

          start = text.index('def test_factory_receives_explicit_boundaries():\n')
          end = text.index('def test_lcd_runtime_has_no_command_implementation_classes():\n', start)
          replacement = '''def test_factory_receives_explicit_boundaries():\n    text = source()\n    factory = Path(\n        "truepanel/host/factory.py"\n    ).read_text(encoding="utf-8")\n\n    assert "safety_services=(" not in text\n    assert "host_agent_safety_services" not in text\n    assert "application_hooks=(" in text\n    assert "host_agent_application_hooks" in text\n    assert "bootstrap=host_bootstrap" in text\n    assert "fan_runtime=bootstrap.fan_runtime" in factory\n    assert "safety_services=bootstrap.safety_services()" in factory\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

      - name: Validate updated contracts
        run: |
          python -m compileall -q \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_factory_wiring.py
          git diff --check

      - name: Commit updated bootstrap factory contracts
        run: |
          rm .github/workflows/update-host-runtime-bootstrap-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_factory_wiring.py \
            .github/workflows/update-host-runtime-bootstrap-contracts.yml
          git diff --cached --check
          git commit -m '[host-runtime-bootstrap-tests] Update bootstrap factory ownership contracts'
          git push origin HEAD:agent/host-runtime-from-bootstrap
