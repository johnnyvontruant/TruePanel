name: Apply Host thermal action binding

on:
  push:
    branches:
      - agent/host-thermal-action-binding

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[host-thermal-binding]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-thermal-action-binding
          fetch-depth: 0

      - name: Bind thermal actions after safety construction
        shell: python
        run: |
          from pathlib import Path

          # Host boundary contract: carry a handler factory rather than a
          # pre-bound handler so safety can exist before restoration is bound.
          path = Path('truepanel/host/hooks.py')
          text = path.read_text(encoding='utf-8')
          old_alias = '''ThermalControlHandler = Callable[\n    [str],\n    Mapping[str, Any],\n]\n\n'''
          new_alias = '''ThermalControlHandler = Callable[\n    [str],\n    Mapping[str, Any],\n]\n\nThermalAutomaticRestorer = Callable[..., Any]\n\nThermalControlHandlerFactory = Callable[\n    [ThermalAutomaticRestorer],\n    ThermalControlHandler,\n]\n\n'''
          if 'ThermalControlHandlerFactory = Callable[' not in text:
              if old_alias not in text:
                  raise SystemExit('thermal handler alias anchor not found')
              text = text.replace(old_alias, new_alias, 1)

          old_field = '    thermal_control_handler: ThermalControlHandler | None = None\n'
          new_field = '''    thermal_control_handler_factory: (\n        ThermalControlHandlerFactory | None\n    ) = None\n'''
          if old_field in text:
              text = text.replace(old_field, new_field, 1)
          elif new_field not in text:
              raise SystemExit('safety service thermal field not found')

          old_exports = '''    "LCDButtonHandler",\n    "ThermalControlHandler",\n]\n'''
          new_exports = '''    "LCDButtonHandler",\n    "ThermalAutomaticRestorer",\n    "ThermalControlHandler",\n    "ThermalControlHandlerFactory",\n]\n'''
          if '    "ThermalControlHandlerFactory",\n' not in text:
              if old_exports not in text:
                  raise SystemExit('hooks export anchor not found')
              text = text.replace(old_exports, new_exports, 1)
          path.write_text(text, encoding='utf-8')

          # Bootstrap owns construction of the handler, but receives only the
          # Host safety restoration callback after safety exists.
          path = Path('truepanel/host/bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old_import = '''from .hooks import (\n    HostAgentSafetyServices,\n    ThermalControlHandler,\n)\n'''
          new_import = '''from .hooks import (\n    HostAgentSafetyServices,\n    ThermalAutomaticRestorer,\n    ThermalControlHandler,\n)\n'''
          if '    ThermalAutomaticRestorer,\n' not in text:
              if old_import not in text:
                  raise SystemExit('bootstrap hooks import anchor not found')
              text = text.replace(old_import, new_import, 1)

          safety_start = text.index('    def safety_services(\n')
          safety_end = text.index('    def record_fan_event(\n', safety_start)
          new_methods = '''    def build_thermal_control_handler(\n        self,\n        restore_automatic: ThermalAutomaticRestorer,\n    ) -> ThermalControlHandler:\n        """Bind thermal actions to Host safety restoration after construction."""\n\n        def handle(\n            action: str,\n        ):\n            return self.thermal_authority.handle_action(\n                action,\n                telemetry_provider=(\n                    self.telemetry.snapshot\n                ),\n                runtime_status_provider=(\n                    self.fan_runtime.status_payload\n                ),\n                restore_automatic=restore_automatic,\n                record_commissioning_event=(\n                    self.record_commissioning_event\n                ),\n            )\n\n        return handle\n\n    def safety_services(\n        self,\n    ) -> HostAgentSafetyServices:\n        """Build the privileged service bundle consumed by Host runtime."""\n\n        return HostAgentSafetyServices(\n            fan_telemetry_provider=(\n                self.telemetry.snapshot\n            ),\n            fan_status_publisher=(\n                self.publish_fan_status\n            ),\n            fan_event_recorder=(\n                lambda decision, telemetry, source: (\n                    self.record_fan_event(\n                        decision,\n                        dict(telemetry),\n                        source=source,\n                    )\n                )\n            ),\n            thermal_control_handler_factory=(\n                self.build_thermal_control_handler\n            ),\n        )\n\n'''
          text = text[:safety_start] + new_methods + text[safety_end:]
          path.write_text(text, encoding='utf-8')

          # Safety stays fail-closed until factory binds the Host-owned handler.
          path = Path('truepanel/host/safety.py')
          text = path.read_text(encoding='utf-8')
          method_anchor = '''    def handle_thermal_control(\n'''
          bind_method = '''    def bind_thermal_control_handler(\n        self,\n        handler: Callable[\n            [str],\n            Mapping[str, Any],\n        ],\n    ) -> None:\n        """Bind thermal action dispatch exactly once after safety exists."""\n\n        if self._thermal_control_handler is not None:\n            raise RuntimeError(\n                "Thermal control handler is already bound"\n            )\n\n        self._thermal_control_handler = handler\n\n'''
          if '    def bind_thermal_control_handler(\n' not in text:
              if method_anchor not in text:
                  raise SystemExit('safety thermal handler anchor not found')
              text = text.replace(method_anchor, bind_method + method_anchor, 1)
          path.write_text(text, encoding='utf-8')

          # Factory constructs safety first, then resolves the circular
          # restoration dependency and binds thermal action handling.
          path = Path('truepanel/host/factory.py')
          text = path.read_text(encoding='utf-8')
          old_handler = '''        thermal_control_handler=(\n            safety_services\n            .thermal_control_handler\n        ),\n'''
          if old_handler in text:
              text = text.replace(old_handler, '', 1)
          elif '.thermal_control_handler\n' in text:
              raise SystemExit('unexpected legacy thermal handler wiring')

          runtime_anchor = '''    runtime = HostAgentRuntime(\n'''
          binding = '''    thermal_control_handler_factory = (\n        safety_services\n        .thermal_control_handler_factory\n    )\n\n    if thermal_control_handler_factory is not None:\n        safety.bind_thermal_control_handler(\n            thermal_control_handler_factory(\n                safety.restore_automatic\n            )\n        )\n\n'''
          if '    thermal_control_handler_factory = (\n' not in text:
              if runtime_anchor not in text:
                  raise SystemExit('Host runtime construction anchor not found')
              text = text.replace(runtime_anchor, binding + runtime_anchor, 1)
          path.write_text(text, encoding='utf-8')

          # Legacy LCD runtime no longer knows thermal arm/disarm mechanics.
          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')
          start_marker = 'def set_thermal_operator_arm_state(\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index('def lcd_on():\n', start)
              text = text[:start] + text[end:]

          old_services = '''        host_agent_safety_services = (\n            host_bootstrap.safety_services(\n                thermal_control_handler=(\n                    set_thermal_operator_arm_state\n                ),\n            )\n        )\n'''
          new_services = '''        host_agent_safety_services = (\n            host_bootstrap.safety_services()\n        )\n'''
          if old_services in text:
              text = text.replace(old_services, new_services, 1)
          elif new_services not in text:
              raise SystemExit('LCD safety service construction anchor not found')
          path.write_text(text, encoding='utf-8')

      - name: Update focused ownership tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_bootstrap_builds_host_safety_services():\n    runtime = FakeFanRuntime()\n    thermal_handler = lambda action: {\n        "action": action,\n    }\n\n    bootstrap = build_host_agent_bootstrap(\n        {},\n        fan_runtime_factory=lambda config: runtime,\n        fan_history_factory=FakeHistory,\n        commissioning_history_factory=FakeHistory,\n        thermal_authority_factory=FakeAuthority,\n        telemetry_factory=FakeTelemetry,\n        status_bridge_factory=FakeStatusBridge,\n    )\n\n    services = bootstrap.safety_services(\n        thermal_control_handler=thermal_handler,\n    )\n\n    assert (\n        services.fan_telemetry_provider\n        == bootstrap.telemetry.snapshot\n    )\n    assert (\n        services.fan_status_publisher\n        == bootstrap.publish_fan_status\n    )\n    assert services.fan_event_recorder is not None\n    assert (\n        services.thermal_control_handler\n        is thermal_handler\n    )\n\n\n'''
          new = '''def test_bootstrap_builds_host_safety_services():\n    runtime = FakeFanRuntime()\n\n    bootstrap = build_host_agent_bootstrap(\n        {},\n        fan_runtime_factory=lambda config: runtime,\n        fan_history_factory=FakeHistory,\n        commissioning_history_factory=FakeHistory,\n        thermal_authority_factory=FakeAuthority,\n        telemetry_factory=FakeTelemetry,\n        status_bridge_factory=FakeStatusBridge,\n    )\n\n    services = bootstrap.safety_services()\n\n    assert (\n        services.fan_telemetry_provider\n        == bootstrap.telemetry.snapshot\n    )\n    assert (\n        services.fan_status_publisher\n        == bootstrap.publish_fan_status\n    )\n    assert services.fan_event_recorder is not None\n    assert (\n        services.thermal_control_handler_factory\n        == bootstrap.build_thermal_control_handler\n    )\n\n\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('bootstrap safety services test anchor not found')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_safety.py')
          text = path.read_text(encoding='utf-8')
          marker = '''def test_reconcile_runs_guarded_service_tick():\n'''
          tests = '''def test_thermal_handler_can_bind_after_safety_construction():\n    coordinator = HostAgentSafetyCoordinator(\n        fan_runtime=FakeRuntime(),\n        telemetry_provider=telemetry,\n    )\n    calls = []\n\n    coordinator.bind_thermal_control_handler(\n        lambda action: calls.append(action) or {\n            "ok": True,\n        }\n    )\n\n    result = coordinator.handle_thermal_control(\n        "arm"\n    )\n\n    assert result["ok"] is True\n    assert calls == ["arm"]\n\n\ndef test_thermal_handler_binding_is_one_shot():\n    coordinator = HostAgentSafetyCoordinator(\n        fan_runtime=FakeRuntime(),\n        telemetry_provider=telemetry,\n    )\n\n    coordinator.bind_thermal_control_handler(\n        lambda action: {"ok": True}\n    )\n\n    try:\n        coordinator.bind_thermal_control_handler(\n            lambda action: {"ok": True}\n        )\n    except RuntimeError as error:\n        assert "already bound" in str(error)\n    else:\n        raise AssertionError(\n            "second thermal handler binding must fail"\n        )\n\n\n'''
          if 'def test_thermal_handler_can_bind_after_safety_construction():' not in text:
              if marker not in text:
                  raise SystemExit('host safety test insertion anchor not found')
              text = text.replace(marker, tests + marker, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_lcd_delegates_thermal_action_binding_to_host():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    factory = Path(\n        "truepanel/host/factory.py"\n    ).read_text(encoding="utf-8")\n\n    assert "set_thermal_operator_arm_state" not in runtime\n    assert "host_bootstrap.safety_services()" in runtime\n    assert "build_thermal_control_handler" in bootstrap\n    assert "thermal_control_handler_factory" in factory\n    assert "bind_thermal_control_handler(" in factory\n    assert "safety.restore_automatic" in factory\n'''
          if 'def test_lcd_delegates_thermal_action_binding_to_host():' not in text:
              text = text.rstrip() + addition.rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

      - name: Validate migration
        run: |
          python -m compileall -q \
            truepanel \
            lcd-menu.py \
            tests/test_host_bootstrap.py \
            tests/test_host_safety.py \
            tests/test_host_bootstrap_wiring.py
          git diff --check

      - name: Commit Host thermal action binding
        run: |
          rm .github/workflows/apply-host-thermal-action-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            truepanel/host/hooks.py \
            truepanel/host/bootstrap.py \
            truepanel/host/safety.py \
            truepanel/host/factory.py \
            lcd-menu.py \
            tests/test_host_bootstrap.py \
            tests/test_host_safety.py \
            tests/test_host_bootstrap_wiring.py \
            .github/workflows/apply-host-thermal-action-binding.yml
          git diff --cached --check
          git commit -m '[host-thermal-binding] Bind thermal actions inside Host factory'
          git push origin HEAD:agent/host-thermal-action-binding
