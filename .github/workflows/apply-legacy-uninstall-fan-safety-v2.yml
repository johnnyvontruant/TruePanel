name: Retry legacy uninstall fan safety

on:
  push:
    branches:
      - fix/legacy-uninstall-fan-safety

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/legacy-uninstall-fan-safety
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded compatibility fix
        run: python3 tools/apply_legacy_uninstall_fan_safety_v2.py

      - name: Validate generated changes
        run: |
          bash -n uninstall.sh
          python3 -m compileall -q tests/test_uninstall_host_cleanup.py
          git diff --check
          git diff -- uninstall.sh tests/test_uninstall_host_cleanup.py

      - name: Install focused test dependencies
        run: python -m pip install -e '.[development]'

      - name: Run focused uninstall tests
        run: python -m pytest tests/test_uninstall_host_cleanup.py -q

      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uninstall.sh tests/test_uninstall_host_cleanup.py
          git commit -m 'Support legacy uninstall fan verification'
          git push origin HEAD:fix/legacy-uninstall-fan-safety

      - name: Remove migration helpers
        run: |
          rm -f tools/apply_legacy_uninstall_fan_safety.py
          rm -f tools/apply_legacy_uninstall_fan_safety_v2.py
          rm -f .github/workflows/apply-legacy-uninstall-fan-safety.yml
          rm -f .github/workflows/apply-legacy-uninstall-fan-safety-v2.yml
          git add -A
          git commit -m 'Remove legacy uninstall migration helpers'
          git push origin HEAD:fix/legacy-uninstall-fan-safety
