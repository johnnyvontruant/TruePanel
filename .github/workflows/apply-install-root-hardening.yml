name: Apply install-root hardening

on:
  push:
    branches:
      - lifecycle/harden-install-root
    paths:
      - .github/workflows/apply-install-root-hardening.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lifecycle/harden-install-root

      - name: Normalize and contain lifecycle roots
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = '''\nnormalize_install_root() {\n  python3 - "$1" <<'PYROOT'\nfrom pathlib import Path\nimport sys\n\nraw = sys.argv[1]\nresolved = Path(raw).expanduser().resolve(strict=False)\nparts = resolved.parts\n\n# Require at least /mnt/<pool>/<managed-directory>. Never permit a pool\n# mount itself, /mnt, or a textual /mnt path that resolves elsewhere.\nif (\n    len(parts) < 4\n    or parts[0] != "/"\n    or parts[1] != "mnt"\n):\n    print(\n        "Installation root must resolve below "\n        "/mnt/<pool>/ and may not be the pool root: "\n        f"{resolved}",\n        file=sys.stderr,\n    )\n    raise SystemExit(1)\n\nprint(resolved)\nPYROOT\n}\n'''

          for name in ("install.sh", "uninstall.sh"):
              path = Path(name)
              text = path.read_text(encoding="utf-8")

              usage_end = "}\n\n"
              usage_start = text.index("usage() {")
              insert_at = text.index(usage_end, usage_start) + len(usage_end)
              assert "normalize_install_root()" not in text
              text = text[:insert_at] + helper + "\n" + text[insert_at:]

              if name == "install.sh":
                  old = '''case "$INSTALL_DIR" in\n  /mnt/*)\n    ;;\n  *)\n    printf 'Installation root must be persistent storage under /mnt/: %s\\n'       "$INSTALL_DIR" >&2\n    exit 1\n    ;;\nesac\n'''
              else:
                  old = '''case "$INSTALL_DIR" in\n  /mnt/*)\n    ;;\n  *)\n    printf 'Installation root must be under /mnt/: %s\\n' \\\n      "$INSTALL_DIR" >&2\n    exit 1\n    ;;\nesac\n'''

              new = '''if ! INSTALL_DIR="$(normalize_install_root "$INSTALL_DIR")"\nthen\n  exit 1\nfi\n'''
              assert text.count(old) == 1, name
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY

      - name: Add executable path-containment contracts
        run: |
          cat > tests/test_lifecycle_install_root_safety.py <<'PY'
          import subprocess
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          def run_preview(script, install_root):
              return subprocess.run(
                  [
                      "bash",
                      str(ROOT / script),
                      "--dry-run",
                      "--root",
                      install_root,
                  ],
                  cwd=ROOT,
                  text=True,
                  capture_output=True,
                  check=False,
              )


          def test_lifecycle_previews_accept_managed_path_below_pool():
              for script in ("install.sh", "uninstall.sh"):
                  result = run_preview(
                      script,
                      "/mnt/TestPool/TruePanel",
                  )

                  assert result.returncode == 0, (
                      script,
                      result.stdout,
                      result.stderr,
                  )
                  assert "/mnt/TestPool/TruePanel" in result.stdout


          def test_lifecycle_previews_reject_pool_root():
              for script in ("install.sh", "uninstall.sh"):
                  result = run_preview(
                      script,
                      "/mnt/TestPool",
                  )

                  assert result.returncode != 0
                  assert (
                      "may not be the pool root"
                      in result.stderr
                  )


          def test_lifecycle_previews_reject_parent_escape_from_mnt():
              for script in ("install.sh", "uninstall.sh"):
                  result = run_preview(
                      script,
                      "/mnt/../tmp/TruePanel",
                  )

                  assert result.returncode != 0
                  assert "/tmp/TruePanel" in result.stderr
                  assert (
                      "must resolve below /mnt/<pool>/"
                      in result.stderr
                  )


          def test_lifecycle_scripts_share_realpath_containment_contract():
              for script in ("install.sh", "uninstall.sh"):
                  text = (ROOT / script).read_text(
                      encoding="utf-8"
                  )

                  assert "normalize_install_root()" in text
                  assert "Path(raw).expanduser().resolve(strict=False)" in text
                  assert "len(parts) < 4" in text
                  assert 'parts[1] != "mnt"' in text
                  assert (
                      'INSTALL_DIR="$(normalize_install_root '
                      '"$INSTALL_DIR")"'
                      in text
                  )
          PY

      - name: Validate hardening
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          python3 -m compileall -q tests/test_lifecycle_install_root_safety.py
          git diff --check

      - name: Commit root hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh uninstall.sh tests/test_lifecycle_install_root_safety.py
          git commit -m "Harden lifecycle install-root containment"
          git rm .github/workflows/apply-install-root-hardening.yml
          git commit -m "Remove install-root hardening migration helper"
          git push origin HEAD:lifecycle/harden-install-root
