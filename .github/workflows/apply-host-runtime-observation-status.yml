name: Apply Host runtime observation and status

on:
  push:
    branches:
      - agent/host-runtime-observation-status

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[host-runtime-observation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-runtime-observation-status
          fetch-depth: 0

      - name: Route observation and status through Host runtime
        shell: python
        run: |
          from pathlib import Path

          path = Path('truepanel/host/reconciliation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    def reconcile(\n        self,\n        *,\n        publish_status: Callable[..., Any] | None = None,\n    ) -> Any | None:\n'''
          method = '''    def observe(\n        self,\n        telemetry: Any = None,\n    ) -> Any:\n        """Evaluate one Host-owned thermal recommendation without actuation."""\n\n        if telemetry is None:\n            telemetry = self._safety.telemetry()\n\n        return self._thermal_observer.observe(\n            telemetry\n        )\n\n'''
          if '    def observe(\n' not in text:
              if anchor not in text:
                  raise SystemExit('reconciliation method anchor not found')
              text = text.replace(anchor, method + anchor, 1)

          old = '''        telemetry = self._safety.telemetry()\n        recommendation = self._thermal_observer.observe(\n            telemetry\n        )\n'''
          new = '''        telemetry = self._safety.telemetry()\n        recommendation = self.observe(\n            telemetry\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('reconciliation observe call anchor not found')
          path.write_text(text, encoding='utf-8')

          path = Path('truepanel/host/runtime.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    def reconcile_fans(self) -> Any | None:\n'''
          methods = '''    def fan_telemetry(self) -> Any:\n        """Return the Host-owned fan/thermal telemetry snapshot."""\n\n        return self._safety.telemetry()\n\n    def publish_fan_status(\n        self,\n        reason: str | None = None,\n    ) -> Any:\n        """Publish the Host-owned fan/thermal status snapshot."""\n\n        return self._safety.publish_status(\n            reason=reason\n        )\n\n    def observe_thermal(\n        self,\n        telemetry: Any = None,\n    ) -> Any:\n        """Evaluate Host thermal guidance without granting authority."""\n\n        if self._fan_reconciliation is None:\n            return None\n\n        return self._fan_reconciliation.observe(\n            telemetry\n        )\n\n'''
          if '    def fan_telemetry(self) -> Any:\n' not in text:
              if anchor not in text:
                  raise SystemExit('Host runtime reconcile anchor not found')
              text = text.replace(anchor, methods + anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def publish_fan_control_status(\n')
          end = text.index('def observe_thermal_fan_policy(\n', start)
          replacement = '''def publish_fan_control_status(\n    reason=None,\n):\n    """Compatibility adapter for Host-owned status publication."""\n\n    if host_agent_runtime is None:\n        return host_bootstrap.publish_fan_status(\n            reason=reason,\n        )\n\n    return host_agent_runtime.publish_fan_status(\n        reason=reason,\n    )\n\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def observe_thermal_fan_policy(\n')
          end = text.index('def end_supervised_thermal_session(\n', start)
          replacement = '''def observe_thermal_fan_policy(\n    telemetry=None,\n):\n    """\n    Evaluate and publish thermal guidance without actuating fan control.\n\n    The automatic_control mode is intentionally unarmed. This observer does\n    not request profiles, invoke the command socket, or write fan hardware.\n    """\n\n    if host_agent_runtime is None:\n        return None\n\n    return host_agent_runtime.observe_thermal(\n        telemetry\n    )\n\n\n'''
          text = text[:start] + replacement + text[end:]

          old_startup = '''    try:\n        observe_thermal_fan_policy()\n        publish_fan_control_status()\n\n        host_agent_safety_services = (\n'''
          new_startup = '''    try:\n        host_agent_safety_services = (\n'''
          if old_startup not in text:
              raise SystemExit('LCD initial observation ordering anchor not found')
          text = text.replace(old_startup, new_startup, 1)

          start_anchor = '''        host_agent_runtime.start()\n'''
          start_replacement = '''        observe_thermal_fan_policy()\n        publish_fan_control_status()\n\n        host_agent_runtime.start()\n'''
          if start_anchor not in text:
              raise SystemExit('Host runtime start anchor not found')
          text = text.replace(start_anchor, start_replacement, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update runtime ownership tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_fan_command_runtime_wiring.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_lcd_uses_bootstrap_command_telemetry():\n')
          end = text.index('def test_lcd_publishes_host_owned_thermal_policy():\n', start)
          replacement = '''def test_lcd_routes_host_telemetry_through_runtime():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    host_runtime = Path(\n        "truepanel/host/runtime.py"\n    ).read_text(encoding="utf-8")\n    provider = Path(\n        "truepanel/host/telemetry.py"\n    ).read_text(encoding="utf-8")\n\n    assert "def fan_command_telemetry():" not in runtime\n    assert "HostFanTelemetryProvider(" not in runtime\n    assert "HostFanTelemetryProvider" in bootstrap\n    assert "fan_status_provider=get_fan_status" in bootstrap\n    assert "def fan_telemetry(" in host_runtime\n    assert "return self._safety.telemetry()" in host_runtime\n    assert '"fan_status": dict(' in provider\n    assert "self._fan_status_provider()" in provider\n\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def test_lcd_publishes_host_owned_thermal_policy():\n')
          end = text.index('def test_observer_does_not_request_profiles():\n', start)
          replacement = '''def test_lcd_routes_thermal_observation_and_status_through_runtime():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    host_runtime = Path(\n        "truepanel/host/runtime.py"\n    ).read_text(encoding="utf-8")\n    reconciliation = Path(\n        "truepanel/host/reconciliation.py"\n    ).read_text(encoding="utf-8")\n    status = Path(\n        "truepanel/host/status.py"\n    ).read_text(encoding="utf-8")\n\n    assert "ThermalFanPolicy" not in runtime\n    assert "ThermalFanPolicy" in bootstrap\n    assert "def observe_thermal_fan_policy(" in runtime\n    assert "host_agent_runtime.observe_thermal(" in runtime\n    assert ".thermal_observer" not in runtime\n    assert "def observe(" in reconciliation\n    assert "def observe_thermal(" in host_runtime\n    assert "def publish_fan_status(" in host_runtime\n    assert "host_agent_runtime.publish_fan_status(" in runtime\n    assert "publish_host_fan_status" in bootstrap\n    assert '"thermal_policy_mode"' in status\n    assert '"thermal_recommended_profile"' in status\n    assert "observe_thermal_fan_policy()" in runtime\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_lcd_uses_host_owned_telemetry_normalizer():\n')
          end = text.index('def test_lcd_uses_host_owned_status_publisher():\n', start)
          replacement = '''def test_lcd_uses_host_owned_telemetry_normalizer():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    host_runtime = Path(\n        "truepanel/host/runtime.py"\n    ).read_text(encoding="utf-8")\n    host_provider = Path(\n        "truepanel/host/telemetry.py"\n    ).read_text(encoding="utf-8")\n    hardware_provider = Path(\n        "truepanel/hardware/drive_temperatures.py"\n    ).read_text(encoding="utf-8")\n\n    assert "DriveTemperatureProvider" not in runtime\n    assert "HostFanTelemetryProvider" not in runtime\n    assert "def fan_command_telemetry(" not in runtime\n    assert "DriveTemperatureProvider" in bootstrap\n    assert "HostFanTelemetryProvider" in bootstrap\n    assert "telemetry=telemetry" in bootstrap\n    assert "def fan_telemetry(" in host_runtime\n    assert "self._safety.telemetry()" in host_runtime\n    assert "class HostFanTelemetryProvider" in host_provider\n    assert "class DriveTemperatureProvider" in hardware_provider\n\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def test_lcd_uses_host_owned_status_publisher():\n')
          end = text.index('def test_lcd_delegates_host_safety_service_assembly():\n', start)
          replacement = '''def test_lcd_uses_host_owned_status_publisher():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    host_runtime = Path(\n        "truepanel/host/runtime.py"\n    ).read_text(encoding="utf-8")\n\n    assert "FanControlStatusBridge" not in runtime\n    assert "publish_host_fan_status" not in runtime\n    assert "FanControlStatusBridge" in bootstrap\n    assert "publish_host_fan_status" in bootstrap\n\n    publisher_start = runtime.index(\n        "def publish_fan_control_status("\n    )\n    publisher_end = runtime.index(\n        "\\ndef ",\n        publisher_start + 1,\n    )\n    publisher = runtime[publisher_start:publisher_end]\n\n    assert "host_agent_runtime.publish_fan_status(" in publisher\n    assert "def publish_fan_status(" in host_runtime\n    assert "fan_control_runtime.status_payload()" not in publisher\n    assert "fan_control_status_bridge.publish(" not in publisher\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    assert "host_bootstrap\\n        .telemetry" in runtime\n',
              '    assert "host_bootstrap\\n        .telemetry" not in runtime\n    assert "host_agent_runtime.observe_thermal(" in runtime\n',
              1,
          )
          text = text.replace(
              '    assert "host_bootstrap.publish_fan_status(" in runtime\n',
              '    assert "host_agent_runtime.publish_fan_status(" in runtime\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_runtime.py')
          text = path.read_text(encoding='utf-8')
          addition = '''\n\nclass FakeSafetySurface:\n    def __init__(self):\n        self.telemetry_calls = 0\n        self.status_reasons = []\n\n    def telemetry(self):\n        self.telemetry_calls += 1\n        return {"telemetry_fresh": True}\n\n    def publish_status(self, reason=None):\n        self.status_reasons.append(reason)\n        return {"reason": reason}\n\n\nclass FakeReconciliationSurface:\n    def __init__(self):\n        self.observe_calls = []\n\n    def observe(self, telemetry=None):\n        self.observe_calls.append(telemetry)\n        return {"recommended_profile": "automatic"}\n\n    def reconcile(self):\n        return "reconciled"\n\n\ndef test_runtime_exposes_host_telemetry_and_status():\n    events = []\n    safety = FakeSafetySurface()\n    runtime = HostAgentRuntime(\n        fan_runtime=FakeFanRuntime(events),\n        safety=safety,\n        fan_server_factory=lambda: None,\n        lcd_server_factory=lambda: None,\n    )\n\n    assert runtime.fan_telemetry() == {"telemetry_fresh": True}\n    assert runtime.publish_fan_status("snapshot") == {"reason": "snapshot"}\n    assert safety.telemetry_calls == 1\n    assert safety.status_reasons == ["snapshot"]\n\n\ndef test_runtime_exposes_non_actuating_thermal_observation():\n    events = []\n    safety = FakeSafetySurface()\n    reconciliation = FakeReconciliationSurface()\n    runtime = HostAgentRuntime(\n        fan_runtime=FakeFanRuntime(events),\n        safety=safety,\n        fan_reconciliation=reconciliation,\n        fan_server_factory=lambda: None,\n        lcd_server_factory=lambda: None,\n    )\n\n    telemetry = {"sample": 1}\n    assert runtime.observe_thermal(telemetry) == {\n        "recommended_profile": "automatic"\n    }\n    assert reconciliation.observe_calls == [telemetry]\n'''
          if 'def test_runtime_exposes_host_telemetry_and_status():' not in text:
              text = text.rstrip() + addition.rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

      - name: Validate migration
        run: |
          python -m compileall -q \
            truepanel/host/runtime.py \
            truepanel/host/reconciliation.py \
            lcd-menu.py \
            tests/test_fan_command_runtime_wiring.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py \
            tests/test_host_runtime.py
          git diff --check

      - name: Commit Host runtime observation/status ownership
        run: |
          rm .github/workflows/apply-host-runtime-observation-status.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            truepanel/host/runtime.py \
            truepanel/host/reconciliation.py \
            lcd-menu.py \
            tests/test_fan_command_runtime_wiring.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py \
            tests/test_host_runtime.py \
            .github/workflows/apply-host-runtime-observation-status.yml
          git diff --cached --check
          git commit -m '[host-runtime-observation] Route observation and status through Host runtime'
          git push origin HEAD:agent/host-runtime-observation-status
