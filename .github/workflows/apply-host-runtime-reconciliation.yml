name: Apply Host runtime reconciliation

on:
  push:
    branches:
      - agent/host-runtime-reconciliation

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[host-runtime-reconcile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-runtime-reconciliation
          fetch-depth: 0

      - name: Move reconciliation construction into Host runtime
        shell: python
        run: |
          from pathlib import Path

          path = Path('truepanel/host/hooks.py')
          text = path.read_text(encoding='utf-8')
          alias_anchor = '''ThermalControlHandlerFactory = Callable[\n    [ThermalAutomaticRestorer],\n    ThermalControlHandler,\n]\n\n'''
          alias = '''FanReconciliationFactory = Callable[[Any], Any]\n\n'''
          if 'FanReconciliationFactory = Callable[[Any], Any]' not in text:
              if alias_anchor not in text:
                  raise SystemExit('hooks factory alias anchor not found')
              text = text.replace(alias_anchor, alias_anchor + alias, 1)

          field_anchor = '''    thermal_control_handler_factory: (\n        ThermalControlHandlerFactory | None\n    ) = None\n'''
          field = '''    fan_reconciliation_factory: (\n        FanReconciliationFactory | None\n    ) = None\n'''
          if '    fan_reconciliation_factory: (\n' not in text:
              if field_anchor not in text:
                  raise SystemExit('safety services field anchor not found')
              text = text.replace(field_anchor, field_anchor + field, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('truepanel/host/bootstrap.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from .status import publish_host_fan_status\n'
          reconciliation_import = '''from .reconciliation import (\n    HostFanReconciliationCoordinator,\n)\n'''
          if reconciliation_import not in text:
              if import_anchor not in text:
                  raise SystemExit('bootstrap reconciliation import anchor not found')
              text = text.replace(
                  import_anchor,
                  reconciliation_import + import_anchor,
                  1,
              )

          safety_anchor = '    def safety_services(\n'
          method = '''    def build_fan_reconciliation(\n        self,\n        safety: Any,\n    ) -> HostFanReconciliationCoordinator:\n        """Build Host-owned fan/thermal reconciliation after safety exists."""\n\n        return HostFanReconciliationCoordinator(\n            fan_runtime=self.fan_runtime,\n            safety=safety,\n            thermal_observer=self.thermal_observer,\n            thermal_authority=self.thermal_authority,\n            fan_event_source=self.fan_event_source,\n            record_fan_event=self.record_fan_event,\n            record_commissioning_event=(\n                self.record_commissioning_event\n            ),\n        )\n\n'''
          if '    def build_fan_reconciliation(\n' not in text:
              if safety_anchor not in text:
                  raise SystemExit('bootstrap safety services anchor not found')
              text = text.replace(safety_anchor, method + safety_anchor, 1)

          services_field_anchor = '''            thermal_control_handler_factory=(\n                self.build_thermal_control_handler\n            ),\n'''
          services_field = '''            fan_reconciliation_factory=(\n                self.build_fan_reconciliation\n            ),\n'''
          if '            fan_reconciliation_factory=(\n' not in text:
              if services_field_anchor not in text:
                  raise SystemExit('bootstrap safety services return anchor not found')
              text = text.replace(
                  services_field_anchor,
                  services_field_anchor + services_field,
                  1,
              )
          path.write_text(text, encoding='utf-8')

          path = Path('truepanel/host/factory.py')
          text = path.read_text(encoding='utf-8')
          runtime_anchor = '''    runtime = HostAgentRuntime(\n'''
          construction = '''    fan_reconciliation_factory = (\n        safety_services\n        .fan_reconciliation_factory\n    )\n    fan_reconciliation = (\n        fan_reconciliation_factory(safety)\n        if fan_reconciliation_factory is not None\n        else None\n    )\n\n'''
          if '    fan_reconciliation_factory = (\n' not in text:
              if runtime_anchor not in text:
                  raise SystemExit('Host runtime anchor not found')
              text = text.replace(runtime_anchor, construction + runtime_anchor, 1)

          runtime_field_anchor = '''        safety=safety,\n        fan_server_factory=lambda: (\n'''
          runtime_field = '''        safety=safety,\n        fan_reconciliation=fan_reconciliation,\n        fan_server_factory=lambda: (\n'''
          if '        fan_reconciliation=fan_reconciliation,\n' not in text:
              if runtime_field_anchor not in text:
                  raise SystemExit('Host runtime field anchor not found')
              text = text.replace(runtime_field_anchor, runtime_field, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('truepanel/host/runtime.py')
          text = path.read_text(encoding='utf-8')
          signature_anchor = '''        safety: Any,\n        fan_server_factory: Callable[[], Any | None],\n        lcd_server_factory: Callable[[], Any | None],\n'''
          signature = '''        safety: Any,\n        fan_server_factory: Callable[[], Any | None],\n        lcd_server_factory: Callable[[], Any | None],\n        fan_reconciliation: Any | None = None,\n'''
          if '        fan_reconciliation: Any | None = None,\n' not in text:
              if signature_anchor not in text:
                  raise SystemExit('Host runtime signature anchor not found')
              text = text.replace(signature_anchor, signature, 1)

          init_anchor = '''        self._safety = safety\n        self._fan_server_factory = fan_server_factory\n'''
          init = '''        self._safety = safety\n        self._fan_reconciliation = fan_reconciliation\n        self._fan_server_factory = fan_server_factory\n'''
          if '        self._fan_reconciliation = fan_reconciliation\n' not in text:
              if init_anchor not in text:
                  raise SystemExit('Host runtime init anchor not found')
              text = text.replace(init_anchor, init, 1)

          method_anchor = '''    @property\n    def started(self) -> bool:\n'''
          method = '''    def reconcile_fans(self) -> Any | None:\n        """Run one Host-owned fan/thermal reconciliation cycle."""\n\n        if self._fan_reconciliation is None:\n            return None\n\n        return self._fan_reconciliation.reconcile()\n\n'''
          if '    def reconcile_fans(self) -> Any | None:\n' not in text:
              if method_anchor not in text:
                  raise SystemExit('Host runtime method anchor not found')
              text = text.replace(method_anchor, method + method_anchor, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    HostFanReconciliationCoordinator,\n',
              '',
              1,
          )
          text = text.replace(
              'fan_reconciliation_coordinator = None\n',
              '',
              1,
          )
          text = text.replace(
              '    global fan_reconciliation_coordinator\n',
              '',
              1,
          )

          old_reconcile = '''def reconcile_fan_control():\n    """Compatibility adapter for Host-owned fan reconciliation."""\n\n    if fan_reconciliation_coordinator is None:\n        return None\n\n    return fan_reconciliation_coordinator.reconcile(\n        publish_status=publish_fan_control_status,\n    )\n'''
          new_reconcile = '''def reconcile_fan_control():\n    """Compatibility adapter for Host-owned fan reconciliation."""\n\n    if host_agent_runtime is None:\n        return None\n\n    return host_agent_runtime.reconcile_fans()\n'''
          if old_reconcile in text:
              text = text.replace(old_reconcile, new_reconcile, 1)
          elif new_reconcile not in text:
              raise SystemExit('legacy LCD reconcile adapter not found')

          start_marker = '''        fan_reconciliation_coordinator = (\n            HostFanReconciliationCoordinator(\n'''
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index('        host_agent_runtime.start()\n', start)
              text = text[:start] + text[end:]
          elif 'HostFanReconciliationCoordinator(' in text:
              raise SystemExit('unexpected LCD reconciliation construction')

          path.write_text(text, encoding='utf-8')

      - name: Update focused ownership tests
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_lcd_delegates_reconciliation_construction_to_host():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    factory = Path(\n        "truepanel/host/factory.py"\n    ).read_text(encoding="utf-8")\n    host_runtime = Path(\n        "truepanel/host/runtime.py"\n    ).read_text(encoding="utf-8")\n\n    assert "HostFanReconciliationCoordinator" not in runtime\n    assert "fan_reconciliation_coordinator" not in runtime\n    assert "host_agent_runtime.reconcile_fans()" in runtime\n    assert "build_fan_reconciliation" in bootstrap\n    assert "fan_reconciliation_factory" in factory\n    assert "fan_reconciliation=fan_reconciliation" in factory\n    assert "def reconcile_fans(" in host_runtime\n'''
          if 'def test_lcd_delegates_reconciliation_construction_to_host():' not in text:
              text = text.rstrip() + addition.rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_hooks.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert services.thermal_control_handler_factory is None\n'
          new = '''    assert services.thermal_control_handler_factory is None\n    assert services.fan_reconciliation_factory is None\n'''
          if '    assert services.fan_reconciliation_factory is None\n' not in text:
              if old not in text:
                  raise SystemExit('Host hooks optional field anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate migration
        run: |
          python -m compileall -q \
            truepanel \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_hooks.py
          git diff --check

      - name: Commit Host runtime reconciliation ownership
        run: |
          rm .github/workflows/apply-host-runtime-reconciliation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            truepanel/host/hooks.py \
            truepanel/host/bootstrap.py \
            truepanel/host/factory.py \
            truepanel/host/runtime.py \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_hooks.py \
            .github/workflows/apply-host-runtime-reconciliation.yml
          git diff --cached --check
          git commit -m '[host-runtime-reconcile] Move reconciliation into Host runtime'
          git push origin HEAD:agent/host-runtime-reconciliation
