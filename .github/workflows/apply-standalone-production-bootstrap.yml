name: Apply standalone production bootstrap

on:
  push:
    branches:
      - agent/standalone-production-bootstrap

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[standalone-bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/standalone-production-bootstrap
          fetch-depth: 0

      - name: Separate production construction from standalone activation
        shell: python
        run: |
          from pathlib import Path

          path = Path('truepanel/host/agent.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = '''from typing import Any\n\n'''
          imports = '''from typing import Any\n\nfrom truepanel.config.loader import load_config\n\nfrom .bootstrap import build_host_agent_bootstrap\nfrom .factory import build_host_agent_runtime_from_bootstrap\nfrom .hooks import HostAgentApplicationHooks\n\n'''
          if 'from truepanel.config.loader import load_config\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('Host agent import anchor not found')
              text = text.replace(import_anchor, imports, 1)

          old = '''def build_production_runtime() -> Any:\n    """\n    Production standalone bootstrap placeholder.\n\n    Real hardware construction remains intentionally unavailable until\n    Phase 4B.2 extracts it from the legacy LCD runtime.\n    """\n\n    raise RuntimeError(\n        "Standalone Host Agent hardware bootstrap is not enabled yet."\n    )\n\n\ndef main() -> None:\n    """Run the standalone Host Agent process."""\n\n    process = HostAgentProcess(\n        build_production_runtime\n    )\n\n    install_signal_handlers(process)\n    process.run()\n'''
          new = '''STANDALONE_PRODUCTION_ACTIVATED = False\n\n\ndef build_production_runtime() -> Any:\n    """Construct the production Host runtime without starting it."""\n\n    config = load_config()\n    bootstrap = build_host_agent_bootstrap(\n        config\n    )\n\n    return build_host_agent_runtime_from_bootstrap(\n        bootstrap=bootstrap,\n        application_hooks=(\n            HostAgentApplicationHooks()\n        ),\n    )\n\n\ndef require_standalone_activation() -> None:\n    """Fail closed until standalone Host ownership is explicitly activated."""\n\n    if STANDALONE_PRODUCTION_ACTIVATED:\n        return\n\n    raise RuntimeError(\n        "Standalone Host Agent activation is not enabled yet."\n    )\n\n\ndef main() -> None:\n    """Run the standalone Host Agent process only after explicit activation."""\n\n    require_standalone_activation()\n\n    process = HostAgentProcess(\n        build_production_runtime\n    )\n\n    install_signal_handlers(process)\n    process.run()\n'''
          if old not in text:
              raise SystemExit('standalone production placeholder anchor not found')
          text = text.replace(old, new, 1)

          all_anchor = '    "main",\n'
          entries = '''    "main",\n    "require_standalone_activation",\n    "STANDALONE_PRODUCTION_ACTIVATED",\n'''
          if '    "require_standalone_activation",\n' not in text:
              if all_anchor not in text:
                  raise SystemExit('Host agent __all__ anchor not found')
              text = text.replace(all_anchor, entries, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update standalone Host Agent contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_agent.py')
          text = path.read_text(encoding='utf-8')

          old = '''def test_production_bootstrap_fails_closed():\n    with pytest.raises(\n        RuntimeError,\n        match=(\n            "Standalone Host Agent hardware "\n            "bootstrap is not enabled yet"\n        ),\n    ):\n        agent.build_production_runtime()\n\n\n'''
          new = '''def test_production_bootstrap_constructs_safe_runtime(\n    monkeypatch,\n):\n    config = {"example": True}\n    bootstrap = object()\n    runtime = object()\n    captured = {}\n\n    monkeypatch.setattr(\n        agent,\n        "load_config",\n        lambda: config,\n    )\n\n    def build_bootstrap(value):\n        captured["config"] = value\n        return bootstrap\n\n    def build_runtime(**kwargs):\n        captured.update(kwargs)\n        return runtime\n\n    monkeypatch.setattr(\n        agent,\n        "build_host_agent_bootstrap",\n        build_bootstrap,\n    )\n    monkeypatch.setattr(\n        agent,\n        "build_host_agent_runtime_from_bootstrap",\n        build_runtime,\n    )\n\n    result = agent.build_production_runtime()\n\n    assert result is runtime\n    assert captured["config"] is config\n    assert captured["bootstrap"] is bootstrap\n    hooks = captured["application_hooks"]\n    assert isinstance(\n        hooks,\n        agent.HostAgentApplicationHooks,\n    )\n    assert hooks.lcd_button_handler is None\n\n\ndef test_standalone_activation_fails_closed():\n    assert agent.STANDALONE_PRODUCTION_ACTIVATED is False\n\n    with pytest.raises(\n        RuntimeError,\n        match=(\n            "Standalone Host Agent activation "\n            "is not enabled yet"\n        ),\n    ):\n        agent.require_standalone_activation()\n\n\n'''
          if old not in text:
              raise SystemExit('standalone bootstrap fail-closed test anchor not found')
          text = text.replace(old, new, 1)

          old = '''def test_main_installs_signals_before_run(\n    monkeypatch,\n):\n    events = []\n\n    class FakeProcess:\n        def __init__(self, runtime_factory):\n            del runtime_factory\n            events.append("construct")\n\n        def run(self):\n            events.append("run")\n\n    def install(process):\n        del process\n        events.append("signals")\n\n    monkeypatch.setattr(\n        agent,\n        "HostAgentProcess",\n        FakeProcess,\n    )\n\n    monkeypatch.setattr(\n        agent,\n        "install_signal_handlers",\n        install,\n    )\n\n    agent.main()\n\n    assert events == [\n        "construct",\n        "signals",\n        "run",\n    ]\n'''
          new = '''def test_main_refuses_standalone_activation_before_process_construction(\n    monkeypatch,\n):\n    constructed = []\n\n    monkeypatch.setattr(\n        agent,\n        "HostAgentProcess",\n        lambda runtime_factory: constructed.append(\n            runtime_factory\n        ),\n    )\n\n    with pytest.raises(\n        RuntimeError,\n        match="activation is not enabled yet",\n    ):\n        agent.main()\n\n    assert constructed == []\n\n\ndef test_main_installs_signals_before_run_when_gate_is_open(\n    monkeypatch,\n):\n    events = []\n\n    class FakeProcess:\n        def __init__(self, runtime_factory):\n            del runtime_factory\n            events.append("construct")\n\n        def run(self):\n            events.append("run")\n\n    def install(process):\n        del process\n        events.append("signals")\n\n    monkeypatch.setattr(\n        agent,\n        "require_standalone_activation",\n        lambda: events.append("gate"),\n    )\n    monkeypatch.setattr(\n        agent,\n        "HostAgentProcess",\n        FakeProcess,\n    )\n    monkeypatch.setattr(\n        agent,\n        "install_signal_handlers",\n        install,\n    )\n\n    agent.main()\n\n    assert events == [\n        "gate",\n        "construct",\n        "signals",\n        "run",\n    ]\n'''
          if old not in text:
              raise SystemExit('standalone main ordering test anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('tests/test_host_standalone_bootstrap_contract.py').write_text('''from pathlib import Path\n\n\ndef test_standalone_construction_is_ready_but_activation_is_locked():\n    agent = Path(\n        "truepanel/host/agent.py"\n    ).read_text(encoding="utf-8")\n\n    assert "build_host_agent_bootstrap(" in agent\n    assert "build_host_agent_runtime_from_bootstrap(" in agent\n    assert "HostAgentApplicationHooks()" in agent\n    assert "STANDALONE_PRODUCTION_ACTIVATED = False" in agent\n    assert "require_standalone_activation()" in agent\n\n    main_start = agent.index("def main()")\n    process_start = agent.index(\n        "process = HostAgentProcess(",\n        main_start,\n    )\n    gate_start = agent.index(\n        "require_standalone_activation()",\n        main_start,\n    )\n\n    assert gate_start < process_start\n''', encoding='utf-8')

      - name: Validate migration
        run: |
          python -m compileall -q \
            truepanel/host/agent.py \
            tests/test_host_agent.py \
            tests/test_host_standalone_bootstrap_contract.py
          git diff --check

      - name: Commit standalone production construction bridge
        run: |
          rm .github/workflows/apply-standalone-production-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            truepanel/host/agent.py \
            tests/test_host_agent.py \
            tests/test_host_standalone_bootstrap_contract.py \
            .github/workflows/apply-standalone-production-bootstrap.yml
          git diff --cached --check
          git commit -m '[standalone-bootstrap] Prepare production Host runtime construction'
          git push origin HEAD:agent/standalone-production-bootstrap
