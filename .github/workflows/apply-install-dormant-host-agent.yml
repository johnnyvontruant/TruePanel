name: Apply dormant Host Agent installer wiring

on:
  push:
    branches:
      - agent/install-dormant-host-agent

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/install-dormant-host-agent
          fetch-depth: 0

      - name: Install dormant Host Agent unit in fresh installer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("install.sh")
          text = path.read_text(encoding="utf-8")

          old = '''SERVICE_FILE="/etc/systemd/system/truepanel.service"
          MISSION_CONTROL_SERVICE_FILE="/etc/systemd/system/truepanel-mission-control.service"
          '''
          new = '''SERVICE_FILE="/etc/systemd/system/truepanel.service"
          HOST_AGENT_SERVICE_FILE="/etc/systemd/system/truepanel-host-agent.service"
          MISSION_CONTROL_SERVICE_FILE="/etc/systemd/system/truepanel-mission-control.service"
          '''
          if text.count(old) != 1:
              raise SystemExit("service path anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''echo "Creating systemd service..."
          cat > "$SERVICE_FILE" <<SERVICE
          '''
          new = '''echo "Installing dormant Host Agent service..."
          cat > "$HOST_AGENT_SERVICE_FILE" <<SERVICE
          [Unit]
          Description=TruePanel Privileged Host Agent (standalone activation locked)
          After=local-fs.target
          ConditionPathExists=/run/truepanel/standalone-host-agent.enabled

          [Service]
          Type=simple
          WorkingDirectory=$INSTALL_DIR
          ExecStart=$PYTHON_BIN -m truepanel.host.agent
          Restart=on-failure
          RestartSec=5
          TimeoutStopSec=15
          UMask=0027
          SERVICE

          chmod 0644 "$HOST_AGENT_SERVICE_FILE"
          echo "Standalone Host Agent activation remains locked; unit was not enabled or started."

          echo "Creating systemd service..."
          cat > "$SERVICE_FILE" <<SERVICE
          '''
          if text.count(old) != 1:
              raise SystemExit("service creation anchor mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate installer migration
        run: |
          bash -n install.sh
          python -m py_compile tests/test_install_host_agent_service.py
          git diff --check

      - name: Commit installer wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-install-dormant-host-agent.yml
          git add install.sh tests/test_install_host_agent_service.py
          git commit -m "Install dormant standalone Host Agent service"
          git push origin HEAD:agent/install-dormant-host-agent
