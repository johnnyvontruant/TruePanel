name: Apply clean-install evidence retention

on:
  push:
    branches:
      - docs/persist-clean-install-evidence
    paths:
      - .github/workflows/apply-clean-install-evidence.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/persist-clean-install-evidence

      - name: Persist clean-install evidence outside managed tree
        run: |
          python3 - <<'PY'
          from pathlib import Path

          docs = Path("docs/CLEAN_INSTALL_VALIDATION.md")
          text = docs.read_text(encoding="utf-8")

          old = '''Optional but recommended before destructive testing:\n\n```bash\npython3 truepanel.py compatibility \\\n  --support-bundle \\\n  --output truepanel-pre-clean-install.json\n```\n'''
          new = '''Capture a privacy-safe compatibility support bundle outside the installation root so the baseline survives uninstall:\n\n```bash\nsudo ./bin/truepanel compatibility \\\n  --support-bundle \\\n  --output \\\n  "$TRUEPANEL_VALIDATION_ARTIFACTS/truepanel-pre-clean-install.json"\n\nsudo test -f \\\n  "$TRUEPANEL_VALIDATION_ARTIFACTS/truepanel-pre-clean-install.json"\n```\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          anchor = '''Verify the marker directly:\n\n```bash\ntest ! -e /run/truepanel/standalone-host-agent.enabled\n```\n\n## Phase 6: Functional application checks\n'''
          replacement = '''Verify the marker directly:\n\n```bash\ntest ! -e /run/truepanel/standalone-host-agent.enabled\n```\n\nCapture the fresh-install compatibility state beside the preserved baseline:\n\n```bash\nsudo ./bin/truepanel compatibility \\\n  --support-bundle \\\n  --output \\\n  "$TRUEPANEL_VALIDATION_ARTIFACTS/truepanel-post-clean-install.json"\n\nsudo test -f \\\n  "$TRUEPANEL_VALIDATION_ARTIFACTS/truepanel-post-clean-install.json"\n```\n\nKeep both support bundles with the recorded `main` SHA and validation notes. Do not place either bundle inside the managed TruePanel tree.\n\n## Phase 6: Functional application checks\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, replacement, 1)
          docs.write_text(text, encoding="utf-8")

          tests = Path("tests/test_clean_install_documentation.py")
          body = tests.read_text(encoding="utf-8").rstrip() + '''\n\n\ndef test_runbook_persists_before_and_after_support_bundles():\n    text = read(RUNBOOK)\n\n    assert (\n        '$TRUEPANEL_VALIDATION_ARTIFACTS/'\n        'truepanel-pre-clean-install.json'\n        in text\n    )\n    assert (\n        '$TRUEPANEL_VALIDATION_ARTIFACTS/'\n        'truepanel-post-clean-install.json'\n        in text\n    )\n    assert text.count("--support-bundle") >= 2\n    assert text.count("sudo test -f") >= 3\n    assert (\n        "Do not place either bundle inside the managed TruePanel tree."\n        in text\n    )\n\n\ndef test_pre_clean_support_bundle_is_captured_before_uninstall():\n    text = read(RUNBOOK)\n    baseline = text.index(\n        "truepanel-pre-clean-install.json"\n    )\n    uninstall = text.index(\n        "## Phase 2: Clean uninstall"\n    )\n\n    assert baseline < uninstall\n\n\ndef test_post_clean_support_bundle_is_captured_after_acceptance():\n    text = read(RUNBOOK)\n    phase_5 = text.index(\n        "## Phase 5: Immediate post-install verification"\n    )\n    phase_6 = text.index(\n        "## Phase 6: Functional application checks"\n    )\n    block = text[phase_5:phase_6]\n\n    assert "Host acceptance: PASS" in block\n    assert "truepanel-post-clean-install.json" in block\n'''.rstrip() + "\n"
          tests.write_text(body, encoding="utf-8")
          PY

      - name: Validate evidence contracts
        run: |
          python3 -m compileall -q tests/test_clean_install_documentation.py
          git diff --check

      - name: Commit evidence retention
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLEAN_INSTALL_VALIDATION.md tests/test_clean_install_documentation.py
          git commit -m "Persist clean-install support bundles"
          git rm .github/workflows/apply-clean-install-evidence.yml
          git commit -m "Remove clean-install evidence migration helper"
          git push origin HEAD:docs/persist-clean-install-evidence
