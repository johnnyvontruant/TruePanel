name: Apply post-reboot Host acceptance

on:
  push:
    branches:
      - docs/post-reboot-host-acceptance
    paths:
      - .github/workflows/apply-post-reboot-acceptance.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/post-reboot-host-acceptance

      - name: Require aggregate Host acceptance after reboot
        run: |
          python3 - <<'PY'
          from pathlib import Path

          docs = Path("docs/CLEAN_INSTALL_VALIDATION.md")
          text = docs.read_text(encoding="utf-8")

          old = '''sudo ./bin/truepanel host fan-safety \\\n  --config /mnt/POOL/DATASET/TruePanel/truepanel.yaml\n\ntest ! -e /run/truepanel/standalone-host-agent.enabled\n```\n\nAlso re-check the physical LCD, front-panel buttons, Mission Control status API, and recent service logs.\n\nThe standalone Host Agent must still be dormant after reboot.\n'''
          new = '''sudo ./bin/truepanel host fan-safety \\\n  --config /mnt/POOL/DATASET/TruePanel/truepanel.yaml\nsudo ./bin/truepanel host acceptance \\\n  --root / \\\n  --config /mnt/POOL/DATASET/TruePanel/truepanel.yaml\n\ntest ! -e /run/truepanel/standalone-host-agent.enabled\n```\n\nPost-reboot `host acceptance` must report `Host acceptance: PASS`. Also re-check the physical LCD, front-panel buttons, Mission Control status API, and recent service logs.\n\nThe standalone Host Agent must still be dormant after reboot.\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          docs.write_text(text, encoding="utf-8")

          tests = Path("tests/test_clean_install_documentation.py")
          body = tests.read_text(encoding="utf-8").rstrip() + '''\n\n\ndef test_runbook_requires_aggregate_host_acceptance_after_reboot():\n    text = read(RUNBOOK)\n\n    phase_7 = text.index(\n        "## Phase 7: Reboot validation"\n    )\n    phase_8 = text.index(\n        "## Phase 8: Record the result"\n    )\n    block = text[phase_7:phase_8]\n\n    assert "./bin/truepanel host readiness" in block\n    assert "./bin/truepanel host fan-safety" in block\n    assert "./bin/truepanel host acceptance" in block\n    assert "Host acceptance: PASS" in block\n    assert (\n        block.index("./bin/truepanel host readiness")\n        < block.index("./bin/truepanel host fan-safety")\n        < block.index("./bin/truepanel host acceptance")\n    )\n'''.rstrip() + "\n"
          tests.write_text(body, encoding="utf-8")
          PY

      - name: Validate post-reboot contracts
        run: |
          python3 -m compileall -q tests/test_clean_install_documentation.py
          git diff --check

      - name: Commit post-reboot acceptance gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLEAN_INSTALL_VALIDATION.md tests/test_clean_install_documentation.py
          git commit -m "Require Host acceptance after reboot"
          git rm .github/workflows/apply-post-reboot-acceptance.yml
          git commit -m "Remove post-reboot acceptance migration helper"
          git push origin HEAD:docs/post-reboot-host-acceptance
