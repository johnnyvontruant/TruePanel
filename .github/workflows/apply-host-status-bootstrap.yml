name: Apply Host status bootstrap

on:
  push:
    branches:
      - agent/host-status-bootstrap

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[host-status]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-status-bootstrap
          fetch-depth: 0

      - name: Move status construction into Host bootstrap
        shell: python
        run: |
          from pathlib import Path

          path = Path('truepanel/host/bootstrap.py')
          text = path.read_text(encoding='utf-8')

          hardware_anchor = '''from truepanel.hardware.fan_runtime import (\n    build_fan_control_runtime,\n)\n'''
          bridge_import = '''from truepanel.hardware.fan_status_bridge import (\n    FanControlStatusBridge,\n)\n'''
          if bridge_import not in text:
              if hardware_anchor not in text:
                  raise SystemExit('fan runtime import anchor not found')
              text = text.replace(hardware_anchor, bridge_import + hardware_anchor, 1)

          telemetry_import = 'from .telemetry import HostFanTelemetryProvider\n'
          status_import = 'from .status import publish_host_fan_status\n'
          if status_import not in text:
              if telemetry_import not in text:
                  raise SystemExit('Host telemetry import anchor not found')
              text = text.replace(telemetry_import, status_import + telemetry_import, 1)

          field_anchor = '    telemetry: HostFanTelemetryProvider\n'
          status_field = '    status_bridge: FanControlStatusBridge\n'
          if status_field not in text:
              if field_anchor not in text:
                  raise SystemExit('bootstrap telemetry field anchor not found')
              text = text.replace(field_anchor, field_anchor + status_field, 1)

          method_anchor = '''    def record_fan_event(\n'''
          method = '''    def publish_fan_status(\n        self,\n        reason: str | None = None,\n    ) -> dict[str, Any]:\n        """Publish one authoritative Host fan/thermal status snapshot."""\n\n        return publish_host_fan_status(\n            fan_runtime=self.fan_runtime,\n            thermal_authority=self.thermal_authority,\n            status_bridge=self.status_bridge,\n            reason=reason,\n        )\n\n'''
          if '    def publish_fan_status(\n' not in text:
              if method_anchor not in text:
                  raise SystemExit('bootstrap method anchor not found')
              text = text.replace(method_anchor, method + method_anchor, 1)

          signature_anchor = '''    fan_status_provider=get_fan_status,\n    telemetry_factory=HostFanTelemetryProvider,\n'''
          signature = '''    fan_status_provider=get_fan_status,\n    telemetry_factory=HostFanTelemetryProvider,\n    status_bridge_factory=FanControlStatusBridge,\n'''
          if '    status_bridge_factory=FanControlStatusBridge,\n' not in text:
              if signature_anchor not in text:
                  raise SystemExit('status factory signature anchor not found')
              text = text.replace(signature_anchor, signature, 1)

          telemetry_construct = '''    telemetry = telemetry_factory(\n        temperature_provider=(\n            drive_temperature_provider\n        ),\n        fan_status_provider=fan_status_provider,\n    )\n\n'''
          status_construct = '''    status_bridge = status_bridge_factory()\n\n'''
          if status_construct not in text:
              if telemetry_construct not in text:
                  raise SystemExit('telemetry construction anchor not found')
              text = text.replace(telemetry_construct, telemetry_construct + status_construct, 1)

          return_anchor = '''        telemetry=telemetry,\n        fan_control_history=fan_control_history,\n'''
          return_status = '''        telemetry=telemetry,\n        status_bridge=status_bridge,\n        fan_control_history=fan_control_history,\n'''
          if '        status_bridge=status_bridge,\n' not in text:
              if return_anchor not in text:
                  raise SystemExit('bootstrap return status anchor not found')
              text = text.replace(return_anchor, return_status, 1)

          path.write_text(text, encoding='utf-8')

          lcd_path = Path('lcd-menu.py')
          lcd = lcd_path.read_text(encoding='utf-8')

          lcd = lcd.replace(
              '''from truepanel.hardware.fan_status_bridge import (\n    FanControlStatusBridge,\n)\n''',
              '',
              1,
          )
          lcd = lcd.replace(
              '''from truepanel.host.status import (\n    publish_host_fan_status,\n)\n''',
              '',
              1,
          )
          lcd = lcd.replace('fan_control_status_bridge = FanControlStatusBridge()\n', '', 1)

          old_publish = '''    return publish_host_fan_status(\n        fan_runtime=fan_control_runtime,\n        thermal_authority=thermal_authority,\n        status_bridge=fan_control_status_bridge,\n        reason=reason,\n    )\n'''
          new_publish = '''    return host_bootstrap.publish_fan_status(\n        reason=reason,\n    )\n'''
          if old_publish in lcd:
              lcd = lcd.replace(old_publish, new_publish, 1)
          elif new_publish not in lcd:
              raise SystemExit('LCD status publisher adapter not found')

          old_read = '''    status = fan_control_status_bridge.read(\n        max_age=30.0\n    )\n'''
          new_read = '''    status = host_bootstrap.status_bridge.read(\n        max_age=30.0\n    )\n'''
          if old_read in lcd:
              lcd = lcd.replace(old_read, new_read, 1)
          elif new_read not in lcd:
              raise SystemExit('LCD status read adapter not found')

          lcd_path.write_text(lcd, encoding='utf-8')

      - name: Update status ownership contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap.py')
          text = path.read_text(encoding='utf-8')

          fake_anchor = '''class FakeTelemetry:\n    def __init__(\n        self,\n        *,\n        temperature_provider,\n        fan_status_provider,\n    ):\n        self.temperature_provider = temperature_provider\n        self.fan_status_provider = fan_status_provider\n\n\n'''
          fake_bridge = '''class FakeStatusBridge:\n    pass\n\n\n'''
          if fake_bridge not in text:
              if fake_anchor not in text:
                  raise SystemExit('FakeTelemetry anchor not found')
              text = text.replace(fake_anchor, fake_anchor + fake_bridge, 1)

          marker = '''def test_bootstrap_starts_thermal_authority_safe():\n'''
          test = '''def test_bootstrap_owns_status_bridge():\n    runtime = FakeFanRuntime()\n\n    bootstrap = build_host_agent_bootstrap(\n        {},\n        fan_runtime_factory=lambda config: runtime,\n        fan_history_factory=FakeHistory,\n        commissioning_history_factory=FakeHistory,\n        thermal_authority_factory=FakeAuthority,\n        status_bridge_factory=FakeStatusBridge,\n    )\n\n    assert isinstance(\n        bootstrap.status_bridge,\n        FakeStatusBridge,\n    )\n\n\n'''
          if 'def test_bootstrap_owns_status_bridge():' not in text:
              if marker not in text:
                  raise SystemExit('bootstrap test marker not found')
              text = text.replace(marker, test + marker, 1)

          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_lcd_uses_host_owned_status_publisher():')
          replacement = '''def test_lcd_uses_host_owned_status_publisher():\n    runtime = source()\n\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    assert "FanControlStatusBridge" not in runtime\n    assert "publish_host_fan_status" not in runtime\n    assert "FanControlStatusBridge" in bootstrap\n    assert "publish_host_fan_status" in bootstrap\n\n    publisher_start = runtime.index(\n        "def publish_fan_control_status("\n    )\n    publisher_end = runtime.index(\n        "\\ndef fan_command_telemetry(",\n        publisher_start,\n    )\n    publisher = runtime[publisher_start:publisher_end]\n\n    assert "host_bootstrap.publish_fan_status(" in publisher\n    assert "fan_control_runtime.status_payload()" not in publisher\n    assert "fan_control_status_bridge.publish(" not in publisher\n'''
          text = text[:start] + replacement.rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def test_lcd_wires_fan_control_status_page():\n'
          contract = '''def test_lcd_uses_bootstrap_owned_status_bridge():\n    runtime = Path("lcd-menu.py").read_text()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text()\n\n    assert "FanControlStatusBridge" not in runtime\n    assert "publish_host_fan_status" not in runtime\n    assert "host_bootstrap.publish_fan_status(" in runtime\n    assert "host_bootstrap.status_bridge.read(" in runtime\n    assert "FanControlStatusBridge" in bootstrap\n\n\n'''
          if 'def test_lcd_uses_bootstrap_owned_status_bridge():' not in text:
              if marker not in text:
                  raise SystemExit('fan integration status marker not found')
              text = text.replace(marker, contract + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify syntax
        run: |
          python -m compileall -q \
            truepanel \
            lcd-menu.py \
            tests/test_host_bootstrap.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py

      - name: Commit Host status ownership
        run: |
          rm .github/workflows/apply-host-status-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lcd-menu.py \
            truepanel/host/bootstrap.py \
            tests/test_host_bootstrap.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py \
            .github/workflows/apply-host-status-bootstrap.yml
          git diff --cached --check
          git commit -m '[host-status] Move status publication into Host bootstrap'
          git push origin HEAD:agent/host-status-bootstrap
