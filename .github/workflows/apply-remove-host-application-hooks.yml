name: Apply Host application-hook cleanup

on:
  push:
    branches:
      - agent/remove-host-application-hooks
    paths:
      - .github/workflows/apply-remove-host-application-hooks.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-host-application-hooks
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[development]"

      - name: Update final stale application-hook contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_host_bootstrap_wiring.py")
          text = path.read_text(encoding="utf-8")
          old = '    assert "application_hooks=application_hooks" in factory\n'
          new = '    assert "application_hooks" not in factory\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"expected one stale application-hook assertion, found {count}"
              )
          path.write_text(
              text.replace(old, new, 1),
              encoding="utf-8",
          )
          PY

      - name: Validate Host application-hook cleanup
        run: |
          python -m compileall -q \
            truepanel \
            tests/test_host_factory.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_no_application_hooks.py
          python -m pytest -q \
            tests/test_host_factory.py \
            tests/test_host_factory_wiring.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_host_no_application_hooks.py \
            tests/test_host_agent.py \
            tests/test_lcd_command_application_owner.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          rm .github/workflows/apply-remove-host-application-hooks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[host-boundary] Remove application callback surface"
          git push origin HEAD:agent/remove-host-application-hooks
