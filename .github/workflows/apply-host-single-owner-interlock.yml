name: Apply Host single-owner interlock

on:
  push:
    branches:
      - agent/host-single-owner-interlock
    paths:
      - .github/workflows/apply-host-single-owner-interlock.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-single-owner-interlock
          fetch-depth: 0

      - name: Add Host ownership guard
        shell: bash
        run: |
          cat > truepanel/host/ownership.py <<'PY'
          """Cross-process single-owner interlock for privileged Host hardware."""

          from __future__ import annotations

          import fcntl
          import json
          import os
          from pathlib import Path
          from typing import TextIO

          DEFAULT_HOST_OWNERSHIP_PATH = Path(
              "/run/truepanel/host-owner.lock"
          )


          class HostOwnershipError(RuntimeError):
              """Raised when another process already owns Host hardware."""


          class HostOwnershipGuard:
              """Hold one non-blocking process lease for Host hardware ownership."""

              def __init__(
                  self,
                  owner_name: str,
                  *,
                  path: str | Path = DEFAULT_HOST_OWNERSHIP_PATH,
              ) -> None:
                  owner_name = str(owner_name).strip()
                  if not owner_name:
                      raise ValueError(
                          "Host ownership name must not be empty"
                      )

                  self.owner_name = owner_name
                  self.path = Path(path)
                  self._handle: TextIO | None = None

              @property
              def held(self) -> bool:
                  """Return whether this guard currently owns the lease."""

                  return self._handle is not None

              def acquire(self) -> None:
                  """Acquire exclusive Host ownership without waiting."""

                  if self._handle is not None:
                      return

                  self.path.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                      mode=0o755,
                  )

                  handle = self.path.open(
                      "a+",
                      encoding="utf-8",
                  )

                  try:
                      fcntl.flock(
                          handle.fileno(),
                          fcntl.LOCK_EX | fcntl.LOCK_NB,
                      )
                  except BlockingIOError as error:
                      handle.seek(0)
                      occupant = handle.read().strip()
                      handle.close()

                      detail = (
                          f" Current owner: {occupant}."
                          if occupant
                          else ""
                      )
                      raise HostOwnershipError(
                          "Host hardware ownership is already held."
                          + detail
                      ) from error

                  try:
                      handle.seek(0)
                      handle.truncate()
                      json.dump(
                          {
                              "owner": self.owner_name,
                              "pid": os.getpid(),
                          },
                          handle,
                          sort_keys=True,
                      )
                      handle.write("\n")
                      handle.flush()
                      os.fsync(handle.fileno())
                  except Exception:
                      try:
                          fcntl.flock(
                              handle.fileno(),
                              fcntl.LOCK_UN,
                          )
                      finally:
                          handle.close()
                      raise

                  self._handle = handle

              def release(self) -> None:
                  """Release Host ownership. The lock inode is never unlinked."""

                  handle = self._handle
                  if handle is None:
                      return

                  self._handle = None
                  try:
                      fcntl.flock(
                          handle.fileno(),
                          fcntl.LOCK_UN,
                      )
                  finally:
                      handle.close()


          __all__ = [
              "DEFAULT_HOST_OWNERSHIP_PATH",
              "HostOwnershipError",
              "HostOwnershipGuard",
          ]
          PY

      - name: Wire ownership into Host runtime and factories
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor, found {count}\n{old}"
                  )
              p.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
              )

          replace_once(
              "truepanel/host/runtime.py",
              """        safety: Any,\n        fan_server_factory: Callable[[], Any | None],\n""",
              """        safety: Any,\n        fan_server_factory: Callable[[], Any | None],\n        ownership_guard: Any | None = None,\n""",
          )
          replace_once(
              "truepanel/host/runtime.py",
              """        self._fan_runtime = fan_runtime\n        self._safety = safety\n""",
              """        self._fan_runtime = fan_runtime\n        self._safety = safety\n        self._ownership_guard = ownership_guard\n        self._ownership_acquired = False\n""",
          )
          replace_once(
              "truepanel/host/runtime.py",
              """        try:\n            self._fan_server = (\n""",
              """        if self._ownership_guard is not None:\n            self._ownership_guard.acquire()\n            self._ownership_acquired = True\n\n        try:\n            self._fan_server = (\n""",
          )
          replace_once(
              "truepanel/host/runtime.py",
              """        try:\n            self._fan_runtime.shutdown()\n        except Exception:\n            LOGGER.exception(\n                \"Fan-control runtime shutdown failed\"\n            )\n\n        self._started = False\n""",
              """        if (\n            self._ownership_guard is None\n            or self._ownership_acquired\n        ):\n            try:\n                self._fan_runtime.shutdown()\n            except Exception:\n                LOGGER.exception(\n                    \"Fan-control runtime shutdown failed\"\n                )\n\n        if self._ownership_acquired:\n            try:\n                self._ownership_guard.release()\n            except Exception:\n                LOGGER.exception(\n                    \"Host ownership release failed\"\n                )\n            finally:\n                self._ownership_acquired = False\n\n        self._started = False\n""",
          )

          replace_once(
              "truepanel/host/factory.py",
              """from .hooks import (\n    HostAgentApplicationHooks,\n    HostAgentSafetyServices,\n)\nfrom .runtime import HostAgentRuntime\n""",
              """from .hooks import (\n    HostAgentApplicationHooks,\n    HostAgentSafetyServices,\n)\nfrom .ownership import (\n    DEFAULT_HOST_OWNERSHIP_PATH,\n    HostOwnershipGuard,\n)\nfrom .runtime import HostAgentRuntime\n""",
          )
          replace_once(
              "truepanel/host/factory.py",
              """    safety_services: HostAgentSafetyServices,\n    application_hooks: HostAgentApplicationHooks,\n) -> HostAgentRuntime:\n""",
              """    safety_services: HostAgentSafetyServices,\n    application_hooks: HostAgentApplicationHooks,\n    ownership_guard: Any | None = None,\n) -> HostAgentRuntime:\n""",
          )
          replace_once(
              "truepanel/host/factory.py",
              """        fan_runtime=fan_runtime,\n        safety=safety,\n        fan_status_reader=(\n""",
              """        fan_runtime=fan_runtime,\n        safety=safety,\n        ownership_guard=ownership_guard,\n        fan_status_reader=(\n""",
          )
          replace_once(
              "truepanel/host/factory.py",
              """def build_host_agent_runtime_from_bootstrap(\n    *,\n    bootstrap: Any,\n    application_hooks: HostAgentApplicationHooks,\n) -> HostAgentRuntime:\n    \"\"\"Assemble Host runtime from one privileged bootstrap boundary.\"\"\"\n\n    return build_host_agent_runtime(\n        fan_runtime=bootstrap.fan_runtime,\n        safety_services=bootstrap.safety_services(),\n        application_hooks=application_hooks,\n    )\n""",
              """def build_host_agent_runtime_from_bootstrap(\n    *,\n    bootstrap: Any,\n    application_hooks: HostAgentApplicationHooks,\n    owner_name: str = \"embedded-lcd\",\n    ownership_path: Any = DEFAULT_HOST_OWNERSHIP_PATH,\n) -> HostAgentRuntime:\n    \"\"\"Assemble Host runtime behind one cross-process ownership lease.\"\"\"\n\n    return build_host_agent_runtime(\n        fan_runtime=bootstrap.fan_runtime,\n        safety_services=bootstrap.safety_services(),\n        application_hooks=application_hooks,\n        ownership_guard=HostOwnershipGuard(\n            owner_name,\n            path=ownership_path,\n        ),\n    )\n""",
          )

          replace_once(
              "truepanel/host/agent.py",
              """        application_hooks=(\n            HostAgentApplicationHooks()\n        ),\n    )\n""",
              """        application_hooks=(\n            HostAgentApplicationHooks()\n        ),\n        owner_name=\"standalone-host-agent\",\n    )\n""",
          )

          replace_once(
              "truepanel/host/__init__.py",
              """from .reconciliation import (\n    HostFanReconciliationCoordinator,\n)\nfrom .runtime import HostAgentRuntime\n""",
              """from .reconciliation import (\n    HostFanReconciliationCoordinator,\n)\nfrom .ownership import (\n    DEFAULT_HOST_OWNERSHIP_PATH,\n    HostOwnershipError,\n    HostOwnershipGuard,\n)\nfrom .runtime import HostAgentRuntime\n""",
          )
          replace_once(
              "truepanel/host/__init__.py",
              """    \"HostFanReconciliationCoordinator\",\n    \"HostThermalAuthority\",\n""",
              """    \"HostFanReconciliationCoordinator\",\n    \"HostOwnershipError\",\n    \"HostOwnershipGuard\",\n    \"DEFAULT_HOST_OWNERSHIP_PATH\",\n    \"HostThermalAuthority\",\n""",
          )

          replace_once(
              "tests/test_host_agent.py",
              """    assert captured[\"bootstrap\"] is bootstrap\n    hooks = captured[\"application_hooks\"]\n""",
              """    assert captured[\"bootstrap\"] is bootstrap\n    assert captured[\"owner_name\"] == \"standalone-host-agent\"\n    hooks = captured[\"application_hooks\"]\n""",
          )
          PY

      - name: Add ownership tests
        shell: bash
        run: |
          cat > tests/test_host_ownership.py <<'PY'
          import json
          import os

          import pytest

          from truepanel.host.ownership import (
              HostOwnershipError,
              HostOwnershipGuard,
          )


          def test_ownership_guard_blocks_second_owner(tmp_path):
              path = tmp_path / "host-owner.lock"
              first = HostOwnershipGuard(
                  "embedded-lcd",
                  path=path,
              )
              second = HostOwnershipGuard(
                  "standalone-host-agent",
                  path=path,
              )

              first.acquire()
              try:
                  record = json.loads(
                      path.read_text(encoding="utf-8")
                  )
                  assert record == {
                      "owner": "embedded-lcd",
                      "pid": os.getpid(),
                  }

                  with pytest.raises(
                      HostOwnershipError,
                      match="embedded-lcd",
                  ):
                      second.acquire()
              finally:
                  first.release()

              second.acquire()
              assert second.held is True
              second.release()
              assert second.held is False


          def test_ownership_guard_is_idempotent(tmp_path):
              guard = HostOwnershipGuard(
                  "embedded-lcd",
                  path=tmp_path / "host-owner.lock",
              )

              guard.acquire()
              guard.acquire()
              assert guard.held is True

              guard.release()
              guard.release()
              assert guard.held is False


          def test_ownership_guard_rejects_empty_owner(tmp_path):
              with pytest.raises(
                  ValueError,
                  match="must not be empty",
              ):
                  HostOwnershipGuard(
                      "   ",
                      path=tmp_path / "host-owner.lock",
                  )
          PY

          cat > tests/test_host_runtime_ownership.py <<'PY'
          import pytest

          from truepanel.host.runtime import HostAgentRuntime


          class FakeGuard:
              def __init__(self, events, *, fail=False):
                  self.events = events
                  self.fail = fail

              def acquire(self):
                  self.events.append("ownership.acquire")
                  if self.fail:
                      raise RuntimeError("ownership busy")

              def release(self):
                  self.events.append("ownership.release")


          class FakeServer:
              def __init__(self, name, events, *, fail_start=False):
                  self.name = name
                  self.events = events
                  self.fail_start = fail_start

              def start(self):
                  self.events.append(f"{self.name}.start")
                  if self.fail_start:
                      raise RuntimeError(f"{self.name} failed")

              def stop(self):
                  self.events.append(f"{self.name}.stop")


          class FakeFanRuntime:
              def __init__(self, events):
                  self.events = events

              def shutdown(self):
                  self.events.append("fan_runtime.shutdown")


          def make_runtime(events, guard, *, fail_lcd=False):
              return HostAgentRuntime(
                  fan_runtime=FakeFanRuntime(events),
                  safety=object(),
                  ownership_guard=guard,
                  fan_server_factory=lambda: FakeServer(
                      "fan_server",
                      events,
                  ),
                  lcd_server_factory=lambda: FakeServer(
                      "lcd_server",
                      events,
                      fail_start=fail_lcd,
                  ),
              )


          def test_runtime_holds_ownership_for_privileged_lifetime():
              events = []
              runtime = make_runtime(
                  events,
                  FakeGuard(events),
              )

              runtime.start()
              runtime.shutdown()

              assert events == [
                  "ownership.acquire",
                  "fan_server.start",
                  "lcd_server.start",
                  "lcd_server.stop",
                  "fan_server.stop",
                  "fan_runtime.shutdown",
                  "ownership.release",
              ]


          def test_losing_runtime_never_touches_fan_hardware():
              events = []
              runtime = make_runtime(
                  events,
                  FakeGuard(events, fail=True),
              )

              with pytest.raises(
                  RuntimeError,
                  match="ownership busy",
              ):
                  runtime.start()

              runtime.shutdown()

              assert events == [
                  "ownership.acquire",
              ]


          def test_start_failure_restores_before_releasing_ownership():
              events = []
              runtime = make_runtime(
                  events,
                  FakeGuard(events),
                  fail_lcd=True,
              )

              with pytest.raises(
                  RuntimeError,
                  match="lcd_server failed",
              ):
                  runtime.start()

              assert events == [
                  "ownership.acquire",
                  "fan_server.start",
                  "lcd_server.start",
                  "lcd_server.stop",
                  "fan_server.stop",
                  "fan_runtime.shutdown",
                  "ownership.release",
              ]
          PY

          cat > tests/test_host_factory_ownership.py <<'PY'
          from truepanel.host.factory import (
              build_host_agent_runtime_from_bootstrap,
          )
          from truepanel.host.hooks import (
              HostAgentApplicationHooks,
              HostAgentSafetyServices,
          )


          class FakeFanRuntime:
              enabled = False

              def shutdown(self):
                  pass


          class FakeBootstrap:
              def __init__(self):
                  self.fan_runtime = FakeFanRuntime()

              def safety_services(self):
                  return HostAgentSafetyServices(
                      fan_telemetry_provider=lambda: {},
                  )


          def test_bootstrap_factory_defaults_to_embedded_owner(tmp_path):
              runtime = build_host_agent_runtime_from_bootstrap(
                  bootstrap=FakeBootstrap(),
                  application_hooks=HostAgentApplicationHooks(),
                  ownership_path=tmp_path / "host-owner.lock",
              )

              assert runtime._ownership_guard.owner_name == "embedded-lcd"


          def test_bootstrap_factory_accepts_standalone_owner(tmp_path):
              runtime = build_host_agent_runtime_from_bootstrap(
                  bootstrap=FakeBootstrap(),
                  application_hooks=HostAgentApplicationHooks(),
                  owner_name="standalone-host-agent",
                  ownership_path=tmp_path / "host-owner.lock",
              )

              assert (
                  runtime._ownership_guard.owner_name
                  == "standalone-host-agent"
              )
          PY

          cat > tests/test_host_single_owner_contract.py <<'PY'
          from pathlib import Path


          def test_host_runtime_acquires_owner_before_command_servers():
              source = Path(
                  "truepanel/host/runtime.py"
              ).read_text(encoding="utf-8")

              start = source.index("    def start(self) -> None:")
              end = source.index("    def shutdown(self) -> None:", start)
              block = source[start:end]

              acquire = block.index("self._ownership_guard.acquire()")
              fan_factory = block.index("self._fan_server_factory()")
              lcd_factory = block.index("self._lcd_server_factory()")

              assert acquire < fan_factory < lcd_factory


          def test_host_runtime_restores_before_releasing_owner():
              source = Path(
                  "truepanel/host/runtime.py"
              ).read_text(encoding="utf-8")

              start = source.index("    def shutdown(self) -> None:")
              block = source[start:]

              restore = block.index("self._fan_runtime.shutdown()")
              release = block.index("self._ownership_guard.release()")

              assert restore < release


          def test_embedded_and_standalone_use_distinct_owner_names():
              factory = Path(
                  "truepanel/host/factory.py"
              ).read_text(encoding="utf-8")
              agent = Path(
                  "truepanel/host/agent.py"
              ).read_text(encoding="utf-8")

              assert 'owner_name: str = "embedded-lcd"' in factory
              assert 'owner_name="standalone-host-agent"' in agent
              assert "STANDALONE_PRODUCTION_ACTIVATED = False" in agent
          PY

      - name: Validate migration
        shell: bash
        run: |
          python -m compileall -q truepanel tests/test_host_ownership.py tests/test_host_runtime_ownership.py tests/test_host_factory_ownership.py tests/test_host_single_owner_contract.py
          python -m pytest -q \
            tests/test_host_ownership.py \
            tests/test_host_runtime_ownership.py \
            tests/test_host_factory_ownership.py \
            tests/test_host_single_owner_contract.py \
            tests/test_host_runtime.py \
            tests/test_host_factory.py \
            tests/test_host_agent.py
          git diff --check

      - name: Commit Host single-owner interlock
        shell: bash
        run: |
          rm .github/workflows/apply-host-single-owner-interlock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[host-ownership] Enforce single privileged Host owner"
          git push origin HEAD:agent/host-single-owner-interlock
