name: Apply Host service cycle

on:
  push:
    branches:
      - agent/host-service-cycle
    paths:
      - .github/workflows/apply-host-service-cycle.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-service-cycle
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[development]"

      - name: Add Host-owned service cycle and authority gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one anchor, found {count}\n{old}"
                  )
              p.write_text(
                  text.replace(old, new, 1),
                  encoding="utf-8",
              )

          replace_once(
              "truepanel/host/runtime.py",
              '''    @property
    def safety(self) -> Any:
        """Return the Host Agent safety coordinator."""

        return self._safety

''',
              '''    @property
    def safety(self) -> Any:
        """Return the Host Agent safety coordinator."""

        return self._safety

    def _require_hardware_ownership(self) -> None:
        """Refuse actuating Host work unless this runtime owns hardware."""

        if (
            self._ownership_guard is not None
            and not self._ownership_acquired
        ):
            raise RuntimeError(
                "HostAgentRuntime does not own Host hardware"
            )

''',
          )

          replace_once(
              "truepanel/host/runtime.py",
              '''    def reconcile_fans(self) -> Any | None:
        """Run one Host-owned fan/thermal reconciliation cycle."""

        if self._fan_reconciliation is None:
            return None

        return self._fan_reconciliation.reconcile()
''',
              '''    def reconcile_fans(self) -> Any | None:
        """Run one Host-owned fan/thermal reconciliation cycle."""

        self._require_hardware_ownership()

        if self._fan_reconciliation is None:
            return None

        return self._fan_reconciliation.reconcile()

    def service_cycle(
        self,
        *,
        reconcile: bool = True,
        publish_reason: str | None = None,
    ) -> dict[str, Any]:
        """
        Run one Host service cycle while preserving legacy loop semantics.

        Reconciliation is privileged and therefore requires Host ownership.
        Observation and status publication remain safe for pre-start priming.
        Reconciliation failures are isolated so guidance and status still
        refresh, matching the existing LCD runtime behavior.
        """

        reconciliation = None

        if reconcile:
            self._require_hardware_ownership()
            try:
                reconciliation = self.reconcile_fans()
            except Exception:
                LOGGER.exception(
                    "Fan-control reconciliation failed"
                )

        recommendation = self.observe_thermal()
        status = self.publish_fan_status(
            reason=publish_reason
        )

        return {
            "reconciliation": reconciliation,
            "recommendation": recommendation,
            "status": status,
        }
''',
          )

          replace_once(
              "truepanel/host/runtime.py",
              '''        """End one Host-owned supervised thermal session."""

        if self._thermal_lifecycle is None:
''',
              '''        """End one Host-owned supervised thermal session."""

        self._require_hardware_ownership()

        if self._thermal_lifecycle is None:
''',
          )

          replace_once(
              "truepanel/host/runtime.py",
              '''        """End one Host-owned bounded automatic-control lease."""

        if self._thermal_lifecycle is None:
''',
              '''        """End one Host-owned bounded automatic-control lease."""

        self._require_hardware_ownership()

        if self._thermal_lifecycle is None:
''',
          )

          replace_once(
              "lcd-menu.py",
              '''        observe_thermal_fan_policy()
        publish_fan_control_status()

        host_agent_runtime.start()
''',
              '''        host_agent_runtime.service_cycle(
            reconcile=False
        )

        host_agent_runtime.start()
''',
          )

          replace_once(
              "lcd-menu.py",
              '''        while not shutdown_requested:
            try:
                reconcile_fan_control()
            except Exception:
                LOGGER.exception(
                    "Fan-control reconciliation failed"
                )

            observe_thermal_fan_policy()
            publish_fan_control_status()
            publish_lcd_reader_status()
''',
              '''        while not shutdown_requested:
            host_agent_runtime.service_cycle()
            publish_lcd_reader_status()
''',
          )
          PY

      - name: Add service-cycle contracts
        shell: bash
        run: |
          cat > tests/test_host_service_cycle.py <<'PY'
          import pytest

          from truepanel.host.runtime import HostAgentRuntime


          class FakeGuard:
              def __init__(self, events):
                  self.events = events

              def acquire(self):
                  self.events.append("ownership.acquire")

              def release(self):
                  self.events.append("ownership.release")


          class FakeFanRuntime:
              def __init__(self, events):
                  self.events = events

              def shutdown(self):
                  self.events.append("fan_runtime.shutdown")


          class FakeSafety:
              def __init__(self, events):
                  self.events = events

              def publish_status(self, reason=None):
                  self.events.append(("publish", reason))
                  return {"reason": reason}


          class FakeReconciliation:
              def __init__(self, events, *, fail=False):
                  self.events = events
                  self.fail = fail

              def reconcile(self):
                  self.events.append("reconcile")
                  if self.fail:
                      raise RuntimeError("reconciliation boom")
                  return "decision"

              def observe(self, telemetry=None):
                  self.events.append(("observe", telemetry))
                  return "recommendation"


          class FakeLifecycle:
              def __init__(self, events):
                  self.events = events

              def end_supervised_session(self, *args, **kwargs):
                  self.events.append("end_supervised")
                  return "supervised-ended"

              def end_bounded_automatic_lease(self, *args, **kwargs):
                  self.events.append("end_bounded")
                  return "bounded-ended"

              def supervised_session_active(self):
                  return False


          def build_runtime(events, *, fail_reconcile=False):
              return HostAgentRuntime(
                  fan_runtime=FakeFanRuntime(events),
                  safety=FakeSafety(events),
                  ownership_guard=FakeGuard(events),
                  fan_reconciliation=FakeReconciliation(
                      events,
                      fail=fail_reconcile,
                  ),
                  thermal_lifecycle=FakeLifecycle(events),
                  fan_server_factory=lambda: None,
                  lcd_server_factory=lambda: None,
              )


          def test_prestart_service_cycle_allows_read_only_priming():
              events = []
              runtime = build_runtime(events)

              result = runtime.service_cycle(
                  reconcile=False,
                  publish_reason="prime",
              )

              assert events == [
                  ("observe", None),
                  ("publish", "prime"),
              ]
              assert result == {
                  "reconciliation": None,
                  "recommendation": "recommendation",
                  "status": {"reason": "prime"},
              }


          def test_prestart_active_cycle_refuses_without_ownership():
              events = []
              runtime = build_runtime(events)

              with pytest.raises(
                  RuntimeError,
                  match="does not own Host hardware",
              ):
                  runtime.service_cycle()

              assert events == []


          def test_owned_service_cycle_preserves_reconcile_observe_publish_order():
              events = []
              runtime = build_runtime(events)
              runtime.start()
              events.clear()

              result = runtime.service_cycle()

              assert events == [
                  "reconcile",
                  ("observe", None),
                  ("publish", None),
              ]
              assert result["reconciliation"] == "decision"
              assert result["recommendation"] == "recommendation"


          def test_reconciliation_failure_still_observes_and_publishes():
              events = []
              runtime = build_runtime(
                  events,
                  fail_reconcile=True,
              )
              runtime.start()
              events.clear()

              result = runtime.service_cycle()

              assert events == [
                  "reconcile",
                  ("observe", None),
                  ("publish", None),
              ]
              assert result["reconciliation"] is None
              assert result["recommendation"] == "recommendation"


          def test_actuating_lifecycle_refuses_before_ownership():
              events = []
              runtime = build_runtime(events)

              with pytest.raises(
                  RuntimeError,
                  match="does not own Host hardware",
              ):
                  runtime.end_supervised_thermal_session(
                      "test",
                      lifecycle_action="stop",
                  )

              with pytest.raises(
                  RuntimeError,
                  match="does not own Host hardware",
              ):
                  runtime.end_bounded_automatic_lease(
                      "test",
                      lifecycle_action="stop",
                  )

              assert events == []


          def test_owned_lifecycle_remains_available():
              events = []
              runtime = build_runtime(events)
              runtime.start()
              events.clear()

              assert runtime.end_supervised_thermal_session(
                  "test",
                  lifecycle_action="stop",
              ) == "supervised-ended"
              assert runtime.end_bounded_automatic_lease(
                  "test",
                  lifecycle_action="stop",
              ) == "bounded-ended"

              assert events == [
                  "end_supervised",
                  "end_bounded",
              ]
          PY

          cat > tests/test_lcd_host_service_cycle.py <<'PY'
          from pathlib import Path


          def test_lcd_primes_host_cycle_without_reconciliation_before_start():
              source = Path("lcd-menu.py").read_text(encoding="utf-8")
              main = source[source.index("def main():"):]

              prime = main.index(
                  "host_agent_runtime.service_cycle(\n"
                  "            reconcile=False"
              )
              start = main.index("host_agent_runtime.start()")

              assert prime < start


          def test_lcd_main_loop_delegates_periodic_host_work_to_runtime():
              source = Path("lcd-menu.py").read_text(encoding="utf-8")
              main = source[source.index("def main():"):]

              loop_start = main.index("while not shutdown_requested:")
              loop_end = main.index("delay = 5", loop_start)
              loop = main[loop_start:loop_end]

              assert "host_agent_runtime.service_cycle()" in loop
              assert "reconcile_fan_control()" not in loop
              assert "observe_thermal_fan_policy()" not in loop
              assert "publish_fan_control_status()" not in loop
          PY

      - name: Validate Host service-cycle migration
        run: |
          python -m compileall -q truepanel lcd-menu.py tests/test_host_service_cycle.py tests/test_lcd_host_service_cycle.py
          python -m pytest -q \
            tests/test_host_service_cycle.py \
            tests/test_lcd_host_service_cycle.py \
            tests/test_host_runtime.py \
            tests/test_host_runtime_ownership.py \
            tests/test_fan_runtime_integration.py
          git diff --check

      - name: Commit Host service-cycle migration
        shell: bash
        run: |
          rm .github/workflows/apply-host-service-cycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[host-runtime] Own periodic fan and thermal service cycle"
          git push origin HEAD:agent/host-service-cycle
