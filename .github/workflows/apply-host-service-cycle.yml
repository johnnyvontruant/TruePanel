name: Apply Host service cycle

on:
  push:
    branches:
      - agent/host-service-cycle
    paths:
      - .github/workflows/apply-host-service-cycle.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-service-cycle
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[development]"

      - name: Delegate LCD Host work to service cycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lcd-menu.py")
          text = path.read_text(encoding="utf-8")

          old_prime = (
              "        observe_thermal_fan_policy()\n"
              "        publish_fan_control_status()\n"
              "\n"
              "        host_agent_runtime.start()\n"
          )
          new_prime = (
              "        host_agent_runtime.service_cycle(\n"
              "            reconcile=False\n"
              "        )\n"
              "\n"
              "        host_agent_runtime.start()\n"
          )

          old_loop = (
              "        while not shutdown_requested:\n"
              "            try:\n"
              "                reconcile_fan_control()\n"
              "            except Exception:\n"
              "                LOGGER.exception(\n"
              "                    \"Fan-control reconciliation failed\"\n"
              "                )\n"
              "\n"
              "            observe_thermal_fan_policy()\n"
              "            publish_fan_control_status()\n"
              "            publish_lcd_reader_status()\n"
          )
          new_loop = (
              "        while not shutdown_requested:\n"
              "            host_agent_runtime.service_cycle()\n"
              "            publish_lcd_reader_status()\n"
          )

          for label, old, new in (
              ("prime", old_prime, new_prime),
              ("loop", old_loop, new_loop),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one anchor, found {count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Host service cycle
        shell: bash
        run: |
          python -m compileall -q \
            truepanel \
            lcd-menu.py \
            tests/test_host_service_cycle.py \
            tests/test_lcd_host_service_cycle.py
          python -m pytest -q \
            tests/test_host_service_cycle.py \
            tests/test_lcd_host_service_cycle.py \
            tests/test_host_runtime.py \
            tests/test_host_runtime_ownership.py \
            tests/test_host_thermal_lifecycle.py \
            tests/test_bounded_automatic_runtime.py \
            tests/test_fan_runtime_integration.py
          git diff --check

      - name: Commit Host service cycle
        shell: bash
        run: |
          rm .github/workflows/apply-host-service-cycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[host-runtime] Own periodic fan and thermal service cycle"
          git push origin HEAD:agent/host-service-cycle
