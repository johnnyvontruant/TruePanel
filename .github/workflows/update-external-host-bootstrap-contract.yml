name: Update external Host bootstrap contract

on:
  push:
    branches:
      - agent/lcd-external-host-mode
    paths:
      - .github/workflows/update-external-host-bootstrap-contract.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lcd-external-host-mode

      - name: Make bootstrap ownership contract mode-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/test_host_bootstrap_wiring.py")
          text = path.read_text(encoding="utf-8")

          old = '''    assert (\n        "host_bootstrap = "\n        "build_host_agent_bootstrap("\n        in text\n    )\n'''
          new = '''    assert "host_runtime_mode = resolve_host_runtime_mode()" in text\n    assert "host_bootstrap = (" in text\n    assert "build_host_agent_bootstrap(config)" in text\n    assert (\n        "if host_runtime_mode is HostRuntimeMode.EMBEDDED"\n        in text\n    )\n'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"expected one bootstrap assertion, found {count}"
              )

          path.write_text(
              text.replace(old, new),
              encoding="utf-8",
          )
          PY

      - name: Validate transformed contract
        run: |
          python3 -m compileall -q tests
          git diff --check
          grep -Fq 'host_runtime_mode = resolve_host_runtime_mode()' \
            tests/test_host_bootstrap_wiring.py

      - name: Commit contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-external-host-bootstrap-contract.yml
          git add tests/test_host_bootstrap_wiring.py
          git commit -m "Make Host bootstrap contract mode-aware"
          git push origin HEAD:agent/lcd-external-host-mode
