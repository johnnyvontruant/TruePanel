name: Apply dry-run runbook update

on:
  push:
    branches:
      - docs/dry-run-rehearsal
    paths:
      - .github/workflows/apply-dry-run-runbook.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/dry-run-rehearsal

      - name: Add lifecycle rehearsal steps
        run: |
          python3 - <<'PY'
          from pathlib import Path

          doc = Path("docs/CLEAN_INSTALL_VALIDATION.md")
          text = doc.read_text(encoding="utf-8")

          old = '''Run uninstall from the external source checkout, not from the installed tree:\n\n```bash\nsudo bash uninstall.sh \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n'''
          new = '''Run the uninstall preview first from the external source checkout, not from the installed tree:\n\n```bash\nbash uninstall.sh \\\n  --dry-run \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n\nInspect the complete plan and confirm the install root, services, Host ownership gate, fan Automatic verification gate, runtime files, and install tree are the intended targets. The preview must report that no services were stopped, no fan state changed, and no files were removed.\n\nThen run the real uninstall with the same root:\n\n```bash\nsudo bash uninstall.sh \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''From the clean external source checkout:\n\n```bash\ngit status --short\ngit rev-parse HEAD\npython3 truepanel.py compatibility\nsudo bash install.sh \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n'''
          new = '''From the clean external source checkout, rehearse the install before writing anything:\n\n```bash\ngit status --short\ngit rev-parse HEAD\npython3 truepanel.py compatibility\nbash install.sh \\\n  --dry-run \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n\nInspect the plan and confirm the source tree, persistent install root, configuration behavior, Python runtime setup, CLI wrapper, all three service units, Mission Control environment, systemd reload, and Doctor step are expected. The preview must report that no directories were created, no files were copied or written, no dependencies were installed, and no services were changed.\n\nThen run the real installer with the same root:\n\n```bash\nsudo bash install.sh \\\n  --root /mnt/POOL/DATASET/TruePanel\n```\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          doc.write_text(text, encoding="utf-8")

          tests = Path("tests/test_clean_install_documentation.py")
          test_text = tests.read_text(encoding="utf-8").rstrip()
          addition = '''\n\n\ndef test_runbook_rehearses_uninstall_and_install_before_mutation():\n    text = read(RUNBOOK)\n\n    phase_2 = text.index("## Phase 2: Clean uninstall")\n    phase_3 = text.index("## Phase 3: Prove known residue is gone")\n    uninstall = text[phase_2:phase_3]\n\n    phase_4 = text.index("## Phase 4: Fresh install")\n    phase_5 = text.index("## Phase 5: Immediate post-install verification")\n    install = text[phase_4:phase_5]\n\n    assert "bash uninstall.sh" in uninstall\n    assert "--dry-run" in uninstall\n    assert uninstall.index("--dry-run") < uninstall.index("sudo bash uninstall.sh")\n    assert "no services were stopped" in uninstall\n    assert "no fan state changed" in uninstall\n    assert "no files were removed" in uninstall\n\n    assert "bash install.sh" in install\n    assert "--dry-run" in install\n    assert install.index("--dry-run") < install.index("sudo bash install.sh")\n    assert "no directories were created" in install\n    assert "no files were copied or written" in install\n    assert "no dependencies were installed" in install\n    assert "no services were changed" in install\n'''
          assert "def test_runbook_rehearses_uninstall_and_install_before_mutation():" not in test_text
          tests.write_text(test_text + addition, encoding="utf-8")
          PY

      - name: Validate documentation update
        run: |
          python3 -m compileall -q tests/test_clean_install_documentation.py
          git diff --check

      - name: Commit documentation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CLEAN_INSTALL_VALIDATION.md tests/test_clean_install_documentation.py
          git commit -m "Rehearse clean-install lifecycle before mutation"
          git rm .github/workflows/apply-dry-run-runbook.yml
          git commit -m "Remove dry-run runbook migration helper"
          git push origin HEAD:docs/dry-run-rehearsal
