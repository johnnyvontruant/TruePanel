name: Fix Host telemetry bootstrap return

on:
  push:
    branches:
      - agent/host-telemetry-bootstrap

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[host-telemetry-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-telemetry-bootstrap
          fetch-depth: 0

      - name: Add telemetry to bootstrap return
        shell: python
        run: |
          from pathlib import Path

          path = Path('truepanel/host/bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old = '''        thermal_observer=thermal_observer,\n        fan_control_history=fan_control_history,\n'''
          new = '''        thermal_observer=thermal_observer,\n        telemetry=telemetry,\n        fan_control_history=fan_control_history,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('bootstrap return anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify syntax
        run: python -m compileall -q truepanel lcd-menu.py

      - name: Commit fix
        run: |
          rm .github/workflows/fix-host-telemetry-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add truepanel/host/bootstrap.py .github/workflows/fix-host-telemetry-bootstrap.yml
          git diff --cached --check
          git commit -m '[host-telemetry-fix] Pass telemetry through Host bootstrap'
          git push origin HEAD:agent/host-telemetry-bootstrap
