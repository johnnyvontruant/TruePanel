name: Harden clean-install runbook

on:
  push:
    branches:
      - docs/clean-install-validation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/clean-install-validation
          fetch-depth: 0

      - name: Harden clean-install proof commands
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CLEAN_INSTALL_VALIDATION.md")
          text = path.read_text(encoding="utf-8")

          old = """Optional but recommended before destructive testing:

```bash
python3 truepanel.py compatibility \\
  --support-bundle \\
  --output truepanel-pre-clean-install.json
```
"""
          new = """Optional but recommended before destructive testing:

```bash
sudo ./bin/truepanel compatibility \\
  --support-bundle \\
  --output truepanel-pre-clean-install.json
```
"""
          if text.count(old) != 1:
              raise SystemExit("support bundle anchor mismatch")
          text = text.replace(old, new, 1)

          old = """Reloaded systemd should no longer have TruePanel unit files to display:

```bash
sudo systemctl daemon-reload
sudo systemctl cat truepanel.service || true
sudo systemctl cat truepanel-mission-control.service || true
sudo systemctl cat truepanel-host-agent.service || true
```
"""
          new = """Reload systemd and prove the removed units are not still discoverable:

```bash
sudo systemctl daemon-reload
for unit in \\
  truepanel.service \\
  truepanel-mission-control.service \\
  truepanel-host-agent.service
do
  if sudo systemctl cat "$unit" >/dev/null 2>&1; then
    echo "Unexpected installed systemd unit remains: $unit" >&2
    exit 1
  fi
done
```
"""
          if text.count(old) != 1:
              raise SystemExit("systemd residue anchor mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate runbook hardening
        run: |
          python -m py_compile tests/test_clean_install_documentation.py
          git diff --check

      - name: Commit runbook hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/harden-clean-install-runbook.yml
          git add docs/CLEAN_INSTALL_VALIDATION.md tests/test_clean_install_documentation.py
          git commit -m "Harden clean-install proof commands"
          git push origin HEAD:docs/clean-install-validation
