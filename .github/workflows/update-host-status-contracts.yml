name: Update Host status contracts

on:
  push:
    branches:
      - agent/host-status-bootstrap

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[host-status-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-status-bootstrap
          fetch-depth: 0

      - name: Update stale status wiring assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_fan_command_runtime_wiring.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert (\n        "publish_host_fan_status("\n        in runtime\n    )\n'''
          new = '''    assert "publish_host_fan_status" in bootstrap\n    assert (\n        "host_bootstrap.publish_fan_status("\n        in runtime\n    )\n'''
          if old not in text:
              raise SystemExit('thermal status publisher assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert (\n        "fan_control_status_bridge.read("\n        in text\n    )\n'''
          new = '''    assert (\n        "host_bootstrap.status_bridge.read("\n        in text\n    )\n'''
          if old not in text:
              raise SystemExit('fan control page status bridge assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Verify syntax and diff
        run: |
          python -m compileall -q \
            tests/test_fan_command_runtime_wiring.py \
            tests/test_fan_runtime_integration.py
          git diff --check

      - name: Commit updated contracts
        run: |
          rm .github/workflows/update-host-status-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_fan_command_runtime_wiring.py \
            tests/test_fan_runtime_integration.py \
            .github/workflows/update-host-status-contracts.yml
          git diff --cached --check
          git commit -m '[host-status-tests] Update status ownership contracts'
          git push origin HEAD:agent/host-status-bootstrap
