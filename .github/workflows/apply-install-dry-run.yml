name: Apply install dry run

on:
  push:
    branches:
      - install/dry-run
    paths:
      - .github/workflows/apply-install-dry-run.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: install/dry-run

      - name: Apply installer preview
        run: python3 .github/apply_install_dry_run.py

      - name: Validate migration
        run: |
          bash -n install.sh
          python3 -m compileall -q tests/test_install_host_agent_service.py
          git diff --check

      - name: Commit installer preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install.sh tests/test_install_host_agent_service.py
          git commit -m "Add non-destructive install dry run"
          git rm .github/apply_install_dry_run.py
          git rm .github/workflows/apply-install-dry-run.yml
          git commit -m "Remove install dry-run migration helpers"
          git push origin HEAD:install/dry-run
