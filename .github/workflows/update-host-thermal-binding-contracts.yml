name: Update Host thermal binding contracts

on:
  push:
    branches:
      - agent/host-thermal-action-binding

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[host-thermal-tests]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-thermal-action-binding
          fetch-depth: 0

      - name: Update stale ownership assertions
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_hooks.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert services.thermal_control_handler is None\n'
          new = '    assert services.thermal_control_handler_factory is None\n'
          if old not in text:
              raise SystemExit('Host hooks thermal field assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert (\n        "thermal_control_handler=("\n        "\\n                    set_thermal_operator_arm_state"\n        in runtime\n    )\n'''
          new = '''    assert "set_thermal_operator_arm_state" not in runtime\n    assert "thermal_control_handler_factory=(" in bootstrap\n'''
          if old not in text:
              raise SystemExit('legacy LCD thermal handler assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_thermal_control.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_guarded_runtime_commands_can_still_arm():\n    runtime = Path(\n        "lcd-menu.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    authority = Path(\n        "truepanel/host/thermal_authority.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    assert (\n        "thermal_authority.handle_action("\n        in runtime\n    )\n\n    assert (\n        "self.operator_armed = True"\n        in authority\n    )\n\n    assert (\n        "self.coordinator.configure("\n        in authority\n    )\n\n\n'''
          new = '''def test_guarded_runtime_commands_can_still_arm():\n    runtime = Path(\n        "lcd-menu.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    factory = Path(\n        "truepanel/host/factory.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    authority = Path(\n        "truepanel/host/thermal_authority.py"\n    ).read_text(\n        encoding="utf-8"\n    )\n\n    assert "thermal_authority.handle_action(" not in runtime\n    assert "self.thermal_authority.handle_action(" in bootstrap\n    assert "bind_thermal_control_handler(" in factory\n    assert "safety.restore_automatic" in factory\n\n    assert (\n        "self.operator_armed = True"\n        in authority\n    )\n\n    assert (\n        "self.coordinator.configure("\n        in authority\n    )\n\n\n'''
          if old not in text:
              raise SystemExit('guarded runtime arm contract not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate contract update
        run: |
          python -m compileall -q \
            tests/test_host_hooks.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_thermal_control.py
          git diff --check

      - name: Commit updated contracts
        run: |
          rm .github/workflows/update-host-thermal-binding-contracts.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_host_hooks.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_thermal_control.py \
            .github/workflows/update-host-thermal-binding-contracts.yml
          git diff --cached --check
          git commit -m '[host-thermal-tests] Update thermal binding ownership contracts'
          git push origin HEAD:agent/host-thermal-action-binding
