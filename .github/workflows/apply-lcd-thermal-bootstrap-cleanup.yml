name: Apply LCD thermal bootstrap cleanup

on:
  push:
    branches:
      - agent/lcd-thermal-bootstrap-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[lcd-thermal-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lcd-thermal-bootstrap-cleanup
          fetch-depth: 0

      - name: Remove dead LCD thermal bootstrap state
        shell: python
        run: |
          from pathlib import Path

          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')

          import_block = '''from truepanel.hardware.bounded_automatic import (\n    thermal_safety_fingerprint,\n)\n'''
          if import_block not in text:
              raise SystemExit('thermal safety fingerprint import not found')
          text = text.replace(import_block, '', 1)

          start_marker = 'thermal_policy_config = (\n'
          end_marker = ').strip().lower()\n'
          if start_marker not in text:
              raise SystemExit('legacy thermal policy block not found')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]

          path.write_text(text, encoding='utf-8')

      - name: Add cleanup ownership contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_lcd_has_no_legacy_thermal_bootstrap_state():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n\n    for legacy in (\n        "thermal_policy_config",\n        "thermal_command_cooldown_seconds",\n        "_current_thermal_safety_fingerprint",\n        "_commissioned_thermal_safety_fingerprint",\n        "thermal_safety_fingerprint,",\n    ):\n        assert legacy not in runtime\n\n    assert "thermal_safety_fingerprint" in bootstrap\n    assert "command_cooldown_seconds" in bootstrap\n    assert "commissioned_fingerprint" in bootstrap\n'''
          if 'def test_lcd_has_no_legacy_thermal_bootstrap_state():' not in text:
              text = text.rstrip() + addition.rstrip() + '\n'
          path.write_text(text, encoding='utf-8')

      - name: Validate cleanup
        run: |
          python -m compileall -q \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py
          git diff --check

      - name: Commit LCD thermal cleanup
        run: |
          rm .github/workflows/apply-lcd-thermal-bootstrap-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py \
            .github/workflows/apply-lcd-thermal-bootstrap-cleanup.yml
          git diff --cached --check
          git commit -m '[lcd-thermal-cleanup] Remove dead thermal bootstrap state'
          git push origin HEAD:agent/lcd-thermal-bootstrap-cleanup
