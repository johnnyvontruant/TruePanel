name: Update status page read contract

on:
  push:
    branches:
      - agent/host-runtime-status-read

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[status-page-read-test]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-runtime-status-read
          fetch-depth: 0

      - name: Update fan-control page status-read ownership
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert (\n        "host_bootstrap.status_bridge.read("\n        in text\n    )\n'''
          new = '''    assert (\n        "host_agent_runtime.read_fan_status("\n        in text\n    )\n    assert (\n        "host_bootstrap.status_bridge.read("\n        not in text\n    )\n'''
          if old not in text:
              raise SystemExit('fan-control page read assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Validate contract
        run: |
          python -m compileall -q tests/test_fan_runtime_integration.py
          git diff --check

      - name: Commit status page read contract
        run: |
          rm .github/workflows/update-status-page-read-contract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tests/test_fan_runtime_integration.py \
            .github/workflows/update-status-page-read-contract.yml
          git diff --cached --check
          git commit -m '[status-page-read-test] Update fan-control page ownership contract'
          git push origin HEAD:agent/host-runtime-status-read
