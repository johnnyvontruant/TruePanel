name: Apply Host acceptance CLI

on:
  push:
    branches:
      - agent/host-acceptance-report
    paths:
      - .github/workflows/apply-host-acceptance-cli.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-acceptance-report

      - name: Wire passive acceptance command
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("truepanel/host/commands.py")
          text = path.read_text(encoding="utf-8")

          old = '''from .capabilities import (\n    HostAgentCapabilities,\n    capabilities_from_compatibility,\n)\n'''
          new = '''from .acceptance import (\n    build_host_acceptance_report,\n    format_host_acceptance_report,\n)\nfrom .capabilities import (\n    HostAgentCapabilities,\n    capabilities_from_compatibility,\n)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          anchor = '''    cutover = host_commands.add_parser(\n        "cutover-plan",\n'''
          block = '''    acceptance = host_commands.add_parser(\n        "acceptance",\n        help=(\n            "Aggregate passive Host readiness and "\n            "motherboard fan-safety checks"\n        ),\n    )\n\n    acceptance.add_argument(\n        "--json",\n        action="store_true",\n        dest="host_acceptance_json",\n        help="Output machine-readable JSON",\n    )\n\n    acceptance.add_argument(\n        "--root",\n        dest="host_acceptance_root",\n        help=(\n            "Filesystem root containing deployed service state; "\n            "defaults to the running host"\n        ),\n    )\n\n    acceptance.add_argument(\n        "--config",\n        default="truepanel.yaml",\n        dest="host_acceptance_config",\n        help=(\n            "TruePanel configuration path; "\n            "defaults to truepanel.yaml"\n        ),\n    )\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, block + anchor, 1)

          anchor = '''def run_host_cutover_plan(\n'''
          block = '''def run_host_acceptance(\n    *,\n    json_output: bool = False,\n    root: str | Path = "/",\n    config_path: str | Path = "truepanel.yaml",\n) -> int:\n    """Aggregate passive Host checks used by clean-install acceptance."""\n\n    readiness = collect_host_readiness(\n        root=root\n    )\n    config = load_config(\n        config_path\n    )\n    fan_safety = collect_host_fan_safety(\n        config\n    )\n    report = build_host_acceptance_report(\n        readiness,\n        fan_safety,\n    )\n\n    if json_output:\n        print(\n            json.dumps(\n                report.to_dict(),\n                indent=2,\n                sort_keys=True,\n            )\n        )\n    else:\n        print(\n            format_host_acceptance_report(\n                report\n            )\n        )\n\n    return 0 if report.accepted else 1\n\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, block + anchor, 1)

          anchor = '''    if (\n        getattr(args, "host_command", None)\n        == "cutover-plan"\n    ):\n'''
          block = '''    if (\n        getattr(args, "host_command", None)\n        == "acceptance"\n    ):\n        root = getattr(\n            args,\n            "host_acceptance_root",\n            None,\n        )\n\n        return run_host_acceptance(\n            json_output=bool(\n                getattr(\n                    args,\n                    "host_acceptance_json",\n                    False,\n                )\n            ),\n            root=(\n                Path(root).resolve()\n                if root\n                else Path("/")\n            ),\n            config_path=getattr(\n                args,\n                "host_acceptance_config",\n                "truepanel.yaml",\n            ),\n        )\n\n'''
          assert text.count(anchor) == 1
          text = text.replace(anchor, block + anchor, 1)

          old = '''    "run_host_capabilities",\n    "run_host_cutover_plan",\n'''
          new = '''    "run_host_acceptance",\n    "run_host_capabilities",\n    "run_host_cutover_plan",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Add CLI contracts
        run: |
          cat > tests/test_host_acceptance_cli.py <<'PY'
          import argparse
          import json
          from pathlib import Path

          from truepanel.host.commands import (
              add_host_subcommands,
              handle_host_command,
          )


          def test_host_parser_registers_acceptance_command():
              parser = argparse.ArgumentParser()
              subcommands = parser.add_subparsers(dest="command")
              add_host_subcommands(subcommands)

              args = parser.parse_args(
                  [
                      "host",
                      "acceptance",
                      "--root",
                      "/tmp/root",
                      "--config",
                      "/tmp/truepanel.yaml",
                      "--json",
                  ]
              )

              assert args.command == "host"
              assert args.host_command == "acceptance"
              assert args.host_acceptance_root == "/tmp/root"
              assert args.host_acceptance_config == "/tmp/truepanel.yaml"
              assert args.host_acceptance_json is True


          def test_acceptance_dispatch_forwards_root_config_and_json(monkeypatch):
              calls = []

              def fake_run_host_acceptance(**kwargs):
                  calls.append(kwargs)
                  return 7

              monkeypatch.setattr(
                  "truepanel.host.commands.run_host_acceptance",
                  fake_run_host_acceptance,
              )

              args = argparse.Namespace(
                  command="host",
                  host_command="acceptance",
                  host_acceptance_root="/tmp/root",
                  host_acceptance_config="/tmp/config.yaml",
                  host_acceptance_json=True,
              )

              result = handle_host_command(args)

              assert result == 7
              assert calls == [
                  {
                      "json_output": True,
                      "root": Path("/tmp/root").resolve(),
                      "config_path": "/tmp/config.yaml",
                  }
              ]


          def test_acceptance_command_contract_is_passive():
              source = Path(
                  "truepanel/host/commands.py"
              ).read_text(encoding="utf-8")

              start = source.index("def run_host_acceptance(")
              end = source.index("\ndef ", start + 1)
              block = source[start:end]

              assert "collect_host_readiness(" in block
              assert "collect_host_fan_safety(" in block
              assert "build_host_acceptance_report(" in block

              for forbidden in (
                  "subprocess",
                  "systemctl",
                  "write_text(",
                  "request_profile(",
                  "HostOwnershipGuard",
              ):
                  assert forbidden not in block
          PY

      - name: Validate migration
        run: |
          python3 -m compileall -q truepanel/host tests/test_host_acceptance.py tests/test_host_acceptance_cli.py
          git diff --check

      - name: Commit acceptance CLI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add truepanel/host/commands.py tests/test_host_acceptance_cli.py
          git commit -m "Expose passive Host acceptance command"
          git rm .github/workflows/apply-host-acceptance-cli.yml
          git commit -m "Remove Host acceptance migration helper"
          git push origin HEAD:agent/host-acceptance-report
