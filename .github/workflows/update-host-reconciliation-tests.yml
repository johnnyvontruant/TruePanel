name: Update Host reconciliation tests

on:
  push:
    branches:
      - agent/host-fan-reconciliation

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[test-wire]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-fan-reconciliation
          fetch-depth: 0

      - name: Update stale application-owned assertions
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_function(path, name, body):
              text = path.read_text(encoding='utf-8')
              pattern = rf"^def {name}\(.*?(?=^def |^class |\Z)"
              replacement = body.rstrip() + "\n\n"
              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL,
              )
              if count != 1:
                  raise SystemExit(f"could not replace {name} in {path}")
              path.write_text(updated, encoding='utf-8')

          integration = Path('tests/test_fan_runtime_integration.py')
          replace_function(
              integration,
              'test_lcd_records_reconcile_source_from_classifier',
              '''def test_lcd_reconciliation_classifier_is_host_owned():
              runtime = Path("lcd-menu.py").read_text()
              coordinator = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()

              assert "HostFanReconciliationCoordinator" in runtime
              assert "source_classifier=self._fan_event_source" in coordinator
              assert "fan_event_source=" in runtime
          ''',
          )

          bounded = Path('tests/test_bounded_automatic_runtime.py')
          replace_function(
              bounded,
              'test_safety_tick_precedes_automatic_lease_checks',
              '''def test_safety_tick_precedes_automatic_lease_checks():
              reconciliation = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()
              safety = Path("truepanel/host/safety.py").read_text()

              assert "service.tick(" in safety
              assert reconciliation.index("self._safety.reconcile(") < reconciliation.index(
                  "self._thermal_authority.reconcile("
              )
          ''',
          )

          thermal = Path('tests/test_thermal_control.py')
          replace_function(
              thermal,
              'test_safety_reconcile_precedes_thermal_control',
              '''def test_safety_reconcile_precedes_thermal_control():
              reconciliation = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()
              safety = Path("truepanel/host/safety.py").read_text()

              assert "service.tick(" in safety
              assert reconciliation.index("self._safety.reconcile(") < reconciliation.index(
                  "self._thermal_authority.reconcile("
              )
          ''',
          )

          replace_function(
              thermal,
              'test_thermal_transition_uses_existing_history',
              '''def test_thermal_transition_uses_existing_history():
              reconciliation = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()

              assert "record_fan_event=self._record_fan_event" in reconciliation
              assert "record_commissioning_event=(" in reconciliation
          ''',
          )

          replace_function(
              thermal,
              'test_fan_safety_tick_precedes_supervised_lease_checks',
              '''def test_fan_safety_tick_precedes_supervised_lease_checks():
              reconciliation = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()
              safety = Path("truepanel/host/safety.py").read_text()

              assert "service.tick(" in safety
              assert reconciliation.index("self._safety.reconcile(") < reconciliation.index(
                  "self._thermal_authority.reconcile("
              )
          ''',
          )

          replace_function(
              thermal,
              'test_safety_decision_disarms_lease_without_requesting_automatic',
              '''def test_safety_decision_disarms_lease_without_requesting_automatic():
              reconciliation = Path(
                  "truepanel/host/reconciliation.py"
              ).read_text()

              assert "if decision is not None:" in reconciliation
              assert reconciliation.index("if decision is not None:") < reconciliation.index(
                  "self._thermal_authority.reconcile("
              )
              assert "handle_fan_safety_transition" in reconciliation
          ''',
          )

      - name: Commit and remove one-shot workflow
        run: |
          rm -f .github/workflows/update-host-reconciliation-tests.yml .host-test-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests .github/workflows/update-host-reconciliation-tests.yml .host-test-trigger
          git diff --cached --check
          git commit -m '[test-wire] Update reconciliation ownership contracts'
          git push --force-with-lease origin HEAD:agent/host-fan-reconciliation
