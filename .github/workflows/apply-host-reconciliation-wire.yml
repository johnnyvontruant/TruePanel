name: Apply Host reconciliation wiring

on:
  push:
    branches:
      - agent/host-fan-reconciliation

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[host-wire]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/host-fan-reconciliation
          fetch-depth: 0

      - name: Wire lcd runtime to Host reconciliation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from truepanel.host import (\n    HostAgentApplicationHooks,\n    HostAgentSafetyServices,\n    HostFanTelemetryProvider,\n    build_host_agent_bootstrap,\n    build_host_agent_runtime,\n)'''
          new_import = '''from truepanel.host import (\n    HostAgentApplicationHooks,\n    HostAgentSafetyServices,\n    HostFanReconciliationCoordinator,\n    HostFanTelemetryProvider,\n    build_host_agent_bootstrap,\n    build_host_agent_runtime,\n)'''
          if old_import not in text:
              raise SystemExit('expected Host import block not found')
          text = text.replace(old_import, new_import, 1)

          old_global = 'host_agent_runtime = None\n'
          new_global = 'host_agent_runtime = None\nfan_reconciliation_coordinator = None\n'
          if text.count(old_global) != 1:
              raise SystemExit('expected host_agent_runtime global not found exactly once')
          text = text.replace(old_global, new_global, 1)

          old_reconcile = '''def reconcile_fan_control():\n\n    if (\n        host_agent_runtime is None\n        or not fan_control_runtime.connected\n    ):\n        return None\n\n    telemetry = (\n        host_agent_runtime\n        .safety\n        .telemetry()\n    )\n\n    recommendation = (\n        observe_thermal_fan_policy(\n            telemetry\n        )\n    )\n\n    (\n        decision,\n        safety_telemetry,\n    ) = (\n        host_agent_runtime\n        .safety\n        .reconcile(\n            telemetry=telemetry,\n            source_classifier=(\n                fan_control_event_source\n            ),\n        )\n    )\n\n    if decision is not None:\n        thermal_authority.handle_fan_safety_transition(\n            telemetry=safety_telemetry,\n            telemetry_provider=fan_command_telemetry,\n            restore_automatic=(\n                restore_motherboard_fan_control\n            ),\n            publish_status=(\n                publish_fan_control_status\n            ),\n            record_commissioning_event=(\n                record_thermal_commissioning_event\n            ),\n        )\n\n        return decision\n\n    return thermal_authority.reconcile(\n        recommendation,\n        telemetry=telemetry,\n        runtime_status_provider=(\n            fan_control_runtime.status_payload\n        ),\n        telemetry_provider=fan_command_telemetry,\n        restore_automatic=(\n            restore_motherboard_fan_control\n        ),\n        publish_status=publish_fan_control_status,\n        record_fan_event=record_fan_control_event,\n        record_commissioning_event=(\n            record_thermal_commissioning_event\n        ),\n    )\n'''
          new_reconcile = '''def reconcile_fan_control():\n    """Compatibility adapter for Host-owned fan reconciliation."""\n\n    if fan_reconciliation_coordinator is None:\n        return None\n\n    return fan_reconciliation_coordinator.reconcile(\n        publish_status=publish_fan_control_status,\n    )\n'''
          if old_reconcile not in text:
              raise SystemExit('legacy reconcile_fan_control body not found')
          text = text.replace(old_reconcile, new_reconcile, 1)

          old_main_globals = '''def main():\n    global lcd, menu_item\n    global host_agent_runtime\n'''
          new_main_globals = '''def main():\n    global lcd, menu_item\n    global host_agent_runtime\n    global fan_reconciliation_coordinator\n'''
          if old_main_globals not in text:
              raise SystemExit('main global block not found')
          text = text.replace(old_main_globals, new_main_globals, 1)

          old_runtime = '''        host_agent_runtime = build_host_agent_runtime(\n            fan_runtime=fan_control_runtime,\n            safety_services=(\n                host_agent_safety_services\n            ),\n            application_hooks=(\n                host_agent_application_hooks\n            ),\n        )\n\n        host_agent_runtime.start()'''
          new_runtime = '''        host_agent_runtime = build_host_agent_runtime(\n            fan_runtime=fan_control_runtime,\n            safety_services=(\n                host_agent_safety_services\n            ),\n            application_hooks=(\n                host_agent_application_hooks\n            ),\n        )\n\n        fan_reconciliation_coordinator = (\n            HostFanReconciliationCoordinator(\n                fan_runtime=fan_control_runtime,\n                safety=host_agent_runtime.safety,\n                thermal_observer=(\n                    host_bootstrap.thermal_observer\n                ),\n                thermal_authority=thermal_authority,\n                fan_event_source=(\n                    host_bootstrap.fan_event_source\n                ),\n                record_fan_event=(\n                    host_bootstrap.record_fan_event\n                ),\n                record_commissioning_event=(\n                    host_bootstrap.record_commissioning_event\n                ),\n            )\n        )\n\n        host_agent_runtime.start()'''
          if old_runtime not in text:
              raise SystemExit('Host runtime construction block not found')
          text = text.replace(old_runtime, new_runtime, 1)

          path.write_text(text, encoding='utf-8')

      - name: Update architecture contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')

          old = '''def test_lcd_classifies_completed_safety_recovery():\n    runtime = Path(\n        "lcd-menu.py"\n    ).read_text()\n'''
          if old not in text:
              raise SystemExit('expected integration test anchor not found')

          marker = '''def test_lcd_wires_fan_control_status_page():\n'''
          if marker not in text:
              raise SystemExit('expected integration test marker not found')

          insertion = '''def test_lcd_delegates_fan_reconciliation_to_host():\n    runtime = Path("lcd-menu.py").read_text()\n\n    assert "HostFanReconciliationCoordinator" in runtime\n    assert "fan_reconciliation_coordinator.reconcile(" in runtime\n    assert "host_agent_runtime.safety.reconcile(" not in runtime\n    assert "thermal_authority.reconcile(" not in runtime\n\n\n'''
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit generated wiring and remove one-shot workflow
        run: |
          rm .github/workflows/apply-host-reconciliation-wire.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lcd-menu.py tests/test_fan_runtime_integration.py .github/workflows/apply-host-reconciliation-wire.yml
          git diff --cached --check
          git commit -m '[host-wire] Wire fan reconciliation through Host Agent'
          git push origin HEAD:agent/host-fan-reconciliation
