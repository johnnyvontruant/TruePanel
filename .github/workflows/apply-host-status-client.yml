name: Apply Host status client LCD migration

on:
  push:
    branches:
      - agent/host-status-client
    paths:
      - .github/workflows/apply-host-status-client.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/host-status-client
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development tools
        run: python -m pip install -e ".[development]"

      - name: Route LCD fan status through read-only client
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("lcd-menu.py")
          text = path.read_text(encoding="utf-8")

          replacements = (
              (
                  "from truepanel.host import (\n"
                  "    HostAgentApplicationHooks,\n",
                  "from truepanel.host import (\n"
                  "    HostAgentApplicationHooks,\n"
                  "    HostAgentStatusClient,\n",
              ),
              (
                  "host_agent_runtime = None\n"
                  "storage_health_watcher = build_storage_health_watcher(config)\n",
                  "host_agent_runtime = None\n"
                  "host_status_client = HostAgentStatusClient()\n"
                  "storage_health_watcher = build_storage_health_watcher(config)\n",
              ),
              (
                  "def show_fan_control():\n"
                  "    status = (\n"
                  "        host_agent_runtime.read_fan_status(\n"
                  "            max_age=30.0\n"
                  "        )\n"
                  "        if host_agent_runtime is not None\n"
                  "        else None\n"
                  "    )\n",
                  "def show_fan_control():\n"
                  "    status = host_status_client.read_fan_status(\n"
                  "        max_age=30.0\n"
                  "    )\n",
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one LCD migration anchor, found {count}"
                  )
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cat > tests/test_lcd_host_status_client.py <<'PY'
          from pathlib import Path


          def test_lcd_fan_page_uses_read_only_host_status_client():
              source = Path(
                  "lcd-menu.py"
              ).read_text(encoding="utf-8")

              assert "HostAgentStatusClient" in source
              assert (
                  "host_status_client = HostAgentStatusClient()"
                  in source
              )

              start = source.index("def show_fan_control():")
              end = source.index("\ndef ", start + 1)
              block = source[start:end]

              assert (
                  "host_status_client.read_fan_status("
                  in block
              )
              assert "host_agent_runtime" not in block
              assert "host_bootstrap" not in block


          def test_status_client_is_independent_of_privileged_bootstrap():
              source = Path(
                  "lcd-menu.py"
              ).read_text(encoding="utf-8")

              status_client = source.index(
                  "host_status_client = HostAgentStatusClient()"
              )
              main = source.index("def main():")

              assert status_client < main
          PY

      - name: Validate Host status client migration
        run: |
          python -m compileall -q \
            truepanel \
            lcd-menu.py \
            tests/test_host_status_client.py \
            tests/test_lcd_host_status_client.py
          python -m pytest -q \
            tests/test_host_status_client.py \
            tests/test_lcd_host_status_client.py \
            tests/test_host_runtime.py \
            tests/test_fan_runtime_integration.py \
            tests/test_host_bootstrap_wiring.py
          git diff --check

      - name: Commit Host status client migration
        shell: bash
        run: |
          rm .github/workflows/apply-host-status-client.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[host-client] Read fan status outside embedded Host runtime"
          git push origin HEAD:agent/host-status-client
