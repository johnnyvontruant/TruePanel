name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development tools
        run: python -m pip install -e ".[development]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate HANGAR registry and generated views
        run: |
          python -m truepanel.hangar validate --root .
          output="$(mktemp -d)"
          python -m truepanel.hangar render --output "$output"
          for state in future in_progress completed failed; do
            diff -u "docs/hangar/$state.md" "$output/$state.md"
          done

  installed-wheel-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/truepanel-wheel"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" -m pip install dist/truepanel-*.whl

      - name: Smoke installed AEGIS bridge modules
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" -I -c \
            "import truepanel.aegis.passive_websocket; import truepanel.aegis._truenas_api_client_helper"

      - name: Smoke installed AEGIS airworthiness chain
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" -I \
            "$GITHUB_WORKSPACE/development/tools/smoke_aegis_airworthiness.py"

      - name: Smoke installed CLI outside source checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" \
            "$GITHUB_WORKSPACE/development/tools/smoke_installed_wheel.py"

  rfc4998-bouncycastle-oracle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: development/interop/rfc4998-bouncycastle/pom.xml

      - name: Validate exact RFC 4998 fixture with Bouncy Castle 1.86
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f development/interop/rfc4998-bouncycastle/pom.xml \
            -Dfixture="$GITHUB_WORKSPACE/docs/evidence/aegis-rfc4998-bouncycastle-fixture-v1.json" \
            -Dreceipt="$RUNNER_TEMP/aegis-rfc4998-bouncycastle-receipt-v1.json" \
            verify
          diff -u \
            docs/evidence/aegis-rfc4998-bouncycastle-receipt-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-bouncycastle-receipt-v1.json"

      - name: Preserve independent validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-bouncycastle-receipt
          path: ${{ runner.temp }}/aegis-rfc4998-bouncycastle-receipt-v1.json
          if-no-files-found: error

  rfc4998-etsi-dss-oracle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: development/interop/rfc4998-etsi-dss/pom.xml

      - name: Validate exact RFC 4998 fixture with ETSI DSS 6.5.1
        run: |
          mvn --batch-mode --no-transfer-progress \
            -f development/interop/rfc4998-etsi-dss/pom.xml \
            -Dfixture="$GITHUB_WORKSPACE/docs/evidence/aegis-rfc4998-bouncycastle-fixture-v1.json" \
            -Dreceipt="$RUNNER_TEMP/aegis-rfc4998-etsi-dss-receipt-v1.json" \
            verify
          diff -u \
            docs/evidence/aegis-rfc4998-etsi-dss-receipt-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-etsi-dss-receipt-v1.json"

      - name: Preserve independent validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-etsi-dss-receipt
          path: ${{ runner.temp }}/aegis-rfc4998-etsi-dss-receipt-v1.json
          if-no-files-found: error

  rfc4998-active-record-receipt:
    runs-on: ubuntu-latest
    needs:
      - rfc4998-bouncycastle-oracle
      - rfc4998-etsi-dss-oracle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download same-run Bouncy Castle receipt
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-bouncycastle-receipt
          path: ${{ runner.temp }}/bouncycastle

      - name: Download same-run ETSI DSS receipt
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-etsi-dss-receipt
          path: ${{ runner.temp }}/etsi-dss

      - name: Join exact active-record subjects and oracle verdicts
        run: |
          python -m truepanel.aegis.rfc4998_active_receipt \
            docs/evidence/aegis-rfc4998-active-record-manifest-v1.json \
            "$RUNNER_TEMP/bouncycastle/aegis-rfc4998-bouncycastle-receipt-v1.json" \
            "$RUNNER_TEMP/etsi-dss/aegis-rfc4998-etsi-dss-receipt-v1.json" \
            --output "$RUNNER_TEMP/aegis-rfc4998-active-record-receipt-v1.json"
          diff -u \
            docs/evidence/aegis-rfc4998-active-record-receipt-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-active-record-receipt-v1.json"

      - name: Preserve active-record receipt
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-active-record-receipt
          path: ${{ runner.temp }}/aegis-rfc4998-active-record-receipt-v1.json
          if-no-files-found: error

  rfc4998-authenticated-custody:
    runs-on: ubuntu-latest
    needs: rfc4998-active-record-receipt

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download same-run active-record receipt
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-active-record-receipt
          path: ${{ runner.temp }}/active-record

      - name: Rehearse authenticated read-only custody
        run: |
          python -m truepanel.holodeck.aegis_rfc4998_authenticated_custody \
            --receipt "$RUNNER_TEMP/active-record/aegis-rfc4998-active-record-receipt-v1.json" \
            --output "$RUNNER_TEMP/aegis-rfc4998-authenticated-custody-checkride-v1.json"
          diff -u \
            docs/evidence/aegis-rfc4998-authenticated-custody-checkride-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-authenticated-custody-checkride-v1.json"

      - name: Preserve authenticated-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-authenticated-custody-checkride
          path: ${{ runner.temp }}/aegis-rfc4998-authenticated-custody-checkride-v1.json
          if-no-files-found: error

  rfc4998-timestamped-custody:
    runs-on: ubuntu-latest
    needs: rfc4998-authenticated-custody

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download same-run active-record receipt
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-active-record-receipt
          path: ${{ runner.temp }}/active-record

      - name: Rehearse independent RFC 3161 custody time
        run: |
          python -m truepanel.holodeck.aegis_rfc4998_timestamped_custody \
            --receipt "$RUNNER_TEMP/active-record/aegis-rfc4998-active-record-receipt-v1.json" \
            --output "$RUNNER_TEMP/aegis-rfc4998-timestamped-custody-checkride-v1.json"
          diff -u \
            docs/evidence/aegis-rfc4998-timestamped-custody-checkride-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-timestamped-custody-checkride-v1.json"

      - name: Preserve timestamped-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-timestamped-custody-checkride
          path: ${{ runner.temp }}/aegis-rfc4998-timestamped-custody-checkride-v1.json
          if-no-files-found: error

  rfc4998-transparent-custody:
    runs-on: ubuntu-latest
    needs: rfc4998-timestamped-custody

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download same-run timestamped custody evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-timestamped-custody-checkride
          path: ${{ runner.temp }}/timestamped-custody

      - name: Rehearse signed append-only custody receipt
        run: |
          python -m truepanel.holodeck.aegis_rfc4998_transparent_custody \
            --timestamped-evidence "$RUNNER_TEMP/timestamped-custody/aegis-rfc4998-timestamped-custody-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-rfc4998-transparent-custody-checkride-v1.json"
          diff -u \
            docs/evidence/aegis-rfc4998-transparent-custody-checkride-v1.json \
            "$RUNNER_TEMP/aegis-rfc4998-transparent-custody-checkride-v1.json"

      - name: Preserve transparent-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-rfc4998-transparent-custody-checkride
          path: ${{ runner.temp }}/aegis-rfc4998-transparent-custody-checkride-v1.json
          if-no-files-found: error

  transparency-monitor-quorum:
    runs-on: ubuntu-latest
    needs: rfc4998-transparent-custody
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run transparent custody evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-rfc4998-transparent-custody-checkride
          path: ${{ runner.temp }}/transparent-custody
      - name: Rehearse independent monitor quorum
        run: |
          python -m truepanel.holodeck.aegis_transparency_monitor_quorum \
            --transparent-evidence "$RUNNER_TEMP/transparent-custody/aegis-rfc4998-transparent-custody-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-monitor-quorum-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-monitor-quorum-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-monitor-quorum-checkride-v1.json"
      - name: Preserve monitor-quorum evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-monitor-quorum-checkride
          path: ${{ runner.temp }}/aegis-transparency-monitor-quorum-checkride-v1.json
          if-no-files-found: error

  transparency-witness-continuity:
    runs-on: ubuntu-latest
    needs: transparency-monitor-quorum
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run monitor quorum evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-monitor-quorum-checkride
          path: ${{ runner.temp }}/monitor-quorum
      - name: Rehearse persisted witness continuity
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_continuity \
            --quorum-evidence "$RUNNER_TEMP/monitor-quorum/aegis-transparency-monitor-quorum-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-continuity-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-continuity-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-continuity-checkride-v1.json"
      - name: Preserve witness-continuity evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-continuity-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-continuity-checkride-v1.json
          if-no-files-found: error

  transparency-witness-crash-recovery:
    runs-on: ubuntu-latest
    needs: transparency-witness-continuity
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run witness continuity evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-witness-continuity-checkride
          path: ${{ runner.temp }}/witness-continuity
      - name: Rehearse crash-safe witness recovery
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_crash_recovery \
            --continuity-evidence "$RUNNER_TEMP/witness-continuity/aegis-transparency-witness-continuity-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-crash-recovery-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-crash-recovery-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-crash-recovery-checkride-v1.json"
      - name: Preserve witness crash-recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-crash-recovery-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-crash-recovery-checkride-v1.json
          if-no-files-found: error

  transparency-witness-sqlite-recovery:
    runs-on: ubuntu-latest
    needs: transparency-witness-crash-recovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run witness crash-recovery evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-witness-crash-recovery-checkride
          path: ${{ runner.temp }}/witness-crash-recovery
      - name: Rehearse isolated SQLite witness recovery
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_sqlite_recovery \
            --crash-recovery-evidence "$RUNNER_TEMP/witness-crash-recovery/aegis-transparency-witness-crash-recovery-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-sqlite-recovery-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-sqlite-recovery-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-sqlite-recovery-checkride-v1.json"
      - name: Preserve isolated witness-store evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-sqlite-recovery-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-sqlite-recovery-checkride-v1.json
          if-no-files-found: error

  transparency-witness-storage-faults:
    runs-on: ubuntu-latest
    needs: transparency-witness-sqlite-recovery
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run SQLite witness evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-witness-sqlite-recovery-checkride
          path: ${{ runner.temp }}/witness-sqlite-recovery
      - name: Rehearse anchored witness storage faults
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_storage_faults \
            --sqlite-evidence "$RUNNER_TEMP/witness-sqlite-recovery/aegis-transparency-witness-sqlite-recovery-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-storage-faults-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-storage-faults-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-storage-faults-checkride-v1.json"
      - name: Preserve anchored storage-fault evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-storage-faults-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-storage-faults-checkride-v1.json
          if-no-files-found: error

  transparency-witness-anchor-custody:
    runs-on: ubuntu-latest
    needs: transparency-witness-storage-faults
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run storage-fault evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-witness-storage-faults-checkride
          path: ${{ runner.temp }}/witness-storage-faults
      - name: Rehearse threshold recovery-anchor custody
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_anchor_custody \
            --storage-fault-evidence "$RUNNER_TEMP/witness-storage-faults/aegis-transparency-witness-storage-faults-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-anchor-custody-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-anchor-custody-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-anchor-custody-checkride-v1.json"
      - name: Preserve threshold anchor-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-anchor-custody-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-anchor-custody-checkride-v1.json
          if-no-files-found: error

  transparency-witness-anchor-rotation:
    runs-on: ubuntu-latest
    needs: transparency-witness-anchor-custody
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download same-run anchor-custody evidence
        uses: actions/download-artifact@v4
        with:
          name: aegis-transparency-witness-anchor-custody-checkride
          path: ${{ runner.temp }}/anchor-custody
      - name: Rehearse dual-threshold custodian-root rotation
        run: |
          python -m truepanel.holodeck.aegis_transparency_witness_anchor_rotation \
            --custody-evidence "$RUNNER_TEMP/anchor-custody/aegis-transparency-witness-anchor-custody-checkride-v1.json" \
            --output "$RUNNER_TEMP/aegis-transparency-witness-anchor-rotation-checkride-v1.json"
          diff -u docs/evidence/aegis-transparency-witness-anchor-rotation-checkride-v1.json \
            "$RUNNER_TEMP/aegis-transparency-witness-anchor-rotation-checkride-v1.json"
      - name: Preserve custodian-root rotation evidence
        uses: actions/upload-artifact@v4
        with:
          name: aegis-transparency-witness-anchor-rotation-checkride
          path: ${{ runner.temp }}/aegis-transparency-witness-anchor-rotation-checkride-v1.json
          if-no-files-found: error
