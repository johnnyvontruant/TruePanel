name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development tools
        run: python -m pip install -e ".[development]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Validate HANGAR registry and generated views
        run: |
          python -m truepanel.hangar validate --root .
          output="$(mktemp -d)"
          python -m truepanel.hangar render --output "$output"
          for state in future in_progress completed failed; do
            diff -u "docs/hangar/$state.md" "$output/$state.md"
          done

  installed-wheel-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/truepanel-wheel"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" -m pip install dist/truepanel-*.whl

      - name: Smoke installed CLI outside source checkout
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/truepanel-wheel/bin/python" \
            "$GITHUB_WORKSPACE/development/tools/smoke_installed_wheel.py"
