name: Apply LCD Host adapter cleanup

on:
  push:
    branches:
      - agent/lcd-host-adapter-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[lcd-host-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lcd-host-adapter-cleanup
          fetch-depth: 0

      - name: Remove dead LCD Host aliases and adapters
        shell: python
        run: |
          from pathlib import Path

          path = Path('lcd-menu.py')
          text = path.read_text(encoding='utf-8')

          for block in (
              '''fan_control_history = (\n    host_bootstrap.fan_control_history\n)\n''',
              '''thermal_commissioning_history = (\n    host_bootstrap.thermal_commissioning_history\n)\n''',
          ):
              if block not in text:
                  raise SystemExit(f'legacy Host alias not found: {block.splitlines()[0]}')
              text = text.replace(block, '', 1)

          def remove_function(source, name):
              marker = f'def {name}('
              if marker not in source:
                  raise SystemExit(f'legacy adapter not found: {name}')
              start = source.index(marker)
              next_def = source.find('\ndef ', start + len(marker))
              if next_def == -1:
                  raise SystemExit(f'next function boundary not found: {name}')
              return source[:start] + source[next_def + 1:]

          for name in (
              'record_thermal_commissioning_event',
              'record_fan_control_event',
              'fan_control_event_source',
              'restore_motherboard_fan_control',
          ):
              text = remove_function(text, name)

          path.write_text(text, encoding='utf-8')

      - name: Move stale ownership contracts to Host modules
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_host_bootstrap_wiring.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '''    assert (\n        "host_bootstrap.fan_control_history"\n        in text\n    )\n''',
              '''    assert (\n        "host_bootstrap.fan_control_history"\n        not in text\n    )\n''',
              1,
          )
          text = text.replace(
              '''    assert (\n        "host_bootstrap."\n        "thermal_commissioning_history"\n        in text\n    )\n''',
              '''    assert (\n        "host_bootstrap."\n        "thermal_commissioning_history"\n        not in text\n    )\n''',
              1,
          )

          start = text.index('def test_host_bootstrap_owns_history_behavior():\n')
          end = text.index('def test_automatic_restoration_has_no_lcd_hardware_fallback():\n', start)
          replacement = '''def test_host_bootstrap_owns_history_behavior():\n    runtime = source()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text(encoding="utf-8")\n    reconciliation = Path(\n        "truepanel/host/reconciliation.py"\n    ).read_text(encoding="utf-8")\n    lifecycle = Path(\n        "truepanel/host/thermal_lifecycle.py"\n    ).read_text(encoding="utf-8")\n\n    for legacy in (\n        "record_thermal_commissioning_event(",\n        "record_fan_control_event(",\n        "fan_control_event_source(",\n    ):\n        assert legacy not in runtime\n\n    assert "event_from_decision(" in bootstrap\n    assert "commissioning_event(" in bootstrap\n    assert "fan_control_history.append(" in bootstrap\n    assert "thermal_commissioning_history.append(" in bootstrap\n    assert "fan_event_source=self.fan_event_source" in bootstrap\n    assert "source_classifier=self._fan_event_source" in reconciliation\n    assert "self._record_commissioning_event" in lifecycle\n\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def test_automatic_restoration_has_no_lcd_hardware_fallback():\n')
          end = text.index('def test_lcd_uses_host_owned_telemetry_normalizer():\n', start)
          replacement = '''def test_automatic_restoration_is_host_only():\n    runtime = source()\n    safety = Path(\n        "truepanel/host/safety.py"\n    ).read_text(encoding="utf-8")\n    reconciliation = Path(\n        "truepanel/host/reconciliation.py"\n    ).read_text(encoding="utf-8")\n    lifecycle = Path(\n        "truepanel/host/thermal_lifecycle.py"\n    ).read_text(encoding="utf-8")\n\n    assert "def restore_motherboard_fan_control(" not in runtime\n    assert "def restore_automatic(" in safety\n    assert "restore_automatic=self._safety.restore_automatic" in reconciliation\n    assert "restore_automatic=self._safety.restore_automatic" in lifecycle\n    assert ".request_profile(" not in runtime\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_fan_runtime_integration.py')
          text = path.read_text(encoding='utf-8')

          start = text.index('def test_lcd_classifies_completed_safety_recovery():\n')
          end = text.index('def test_lcd_preserves_timeout_classification():\n', start)
          replacement = '''def test_host_classifies_completed_safety_recovery():\n    runtime = Path("lcd-menu.py").read_text()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text()\n    reconciliation = Path(\n        "truepanel/host/reconciliation.py"\n    ).read_text()\n\n    assert "def fan_control_event_source(" not in runtime\n    assert '"safety recovery confirmed"' in bootstrap\n    assert 'return "recovery"' in bootstrap\n    assert "fan_event_source=self.fan_event_source" in bootstrap\n    assert "source_classifier=self._fan_event_source" in reconciliation\n\n\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def test_lcd_preserves_timeout_classification():\n')
          end = text.index('def test_lcd_delegates_fan_reconciliation_to_host():\n', start)
          replacement = '''def test_host_preserves_timeout_classification():\n    runtime = Path("lcd-menu.py").read_text()\n    bootstrap = Path(\n        "truepanel/host/bootstrap.py"\n    ).read_text()\n\n    assert "host_bootstrap.fan_event_source(" not in runtime\n    assert 'and "expired" in reason_lower' in bootstrap\n    assert 'return "timeout"' in bootstrap\n\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_thermal_control.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert (\n        "host_bootstrap."\n        "thermal_commissioning_history"\n        in runtime\n    )\n'''
          new = '''    assert (\n        "host_bootstrap."\n        "thermal_commissioning_history"\n        not in runtime\n    )\n\n    assert (\n        "thermal_commissioning_history"\n        in bootstrap\n    )\n'''
          if old not in text:
              raise SystemExit('thermal commissioning ownership assertion not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Validate cleanup
        run: |
          python -m compileall -q \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py \
            tests/test_thermal_control.py
          git diff --check

      - name: Commit LCD Host adapter cleanup
        run: |
          rm .github/workflows/apply-lcd-host-adapter-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lcd-menu.py \
            tests/test_host_bootstrap_wiring.py \
            tests/test_fan_runtime_integration.py \
            tests/test_thermal_control.py \
            .github/workflows/apply-lcd-host-adapter-cleanup.yml
          git diff --cached --check
          git commit -m '[lcd-host-cleanup] Remove dead Host compatibility adapters'
          git push origin HEAD:agent/lcd-host-adapter-cleanup
